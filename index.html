<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#153f2a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fazenda Realeza" />
<title>Fazenda Realeza</title>
<style>
  :root{
    --verde:#1f5c3d; --verde2:#2e7d54; --verde-esc:#153f2a;
    --ouro:#c9a44a; --ouro-cl:#e6cf8a;
    --bg:#f4f6f2; --card:#ffffff; --linha:#e2e7df;
    --txt:#20272e; --txt2:#5d6b62; --erro:#b23b3b; --ok:#2e7d54;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  header.top{background:linear-gradient(135deg,var(--verde-esc),var(--verde));color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);position:sticky;top:0;z-index:20}
  header.top .crown{font-size:26px}
  header.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.3px}
  header.top h1 small{display:block;font-size:11px;font-weight:400;color:var(--ouro-cl);letter-spacing:2px;text-transform:uppercase}
  header.top .status{margin-left:auto;font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;background:#8a8;display:inline-block}
  .dot.on{background:#7CFC9A;box-shadow:0 0 6px #7CFC9A}
  .dot.off{background:#ff8a8a}
  .switch{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;background:rgba(255,255,255,.14);padding:5px 11px;border-radius:20px;user-select:none}
  .switch input{accent-color:var(--ouro);width:15px;height:15px}
  .databar{max-width:1080px;margin:-8px auto 40px;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--linha);border-radius:12px;box-shadow:var(--shadow)}
  .databar .db-title{font-weight:700;color:var(--verde)}
  .databar .db-hint{font-size:12px;color:var(--txt2);flex-basis:100%;margin-top:2px}
  .saveind{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.16);color:#fff;white-space:nowrap;transition:background .2s}
  .saveind.saving{background:var(--ouro);color:#3a2f10}
  .saveind.saved{background:#dff3e6;color:#1f7a45}
  .saveind.mem{background:#fbeecb;color:#8a5a12}
  .saveind .pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:middle;animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .savest{font-size:11px;font-weight:700;margin-left:auto;padding:3px 8px;border-radius:6px}
  .savest.ok{color:var(--ok);background:#e1f4e6} .savest.err{color:var(--erro);background:#fdeaea} .savest.idle{color:var(--txt2)}

  nav.tabs{display:flex;gap:2px;background:var(--verde);padding:0 12px;overflow-x:auto}
  nav.tabs button{background:transparent;border:none;color:#dfeee6;padding:12px 18px;font-size:14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
  nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.06)}
  nav.tabs button.active{color:#fff;border-bottom-color:var(--ouro);font-weight:600}

  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
  .subtabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
  .subtabs button{background:var(--card);border:1px solid var(--linha);color:var(--txt2);padding:8px 14px;border-radius:20px;cursor:pointer;font-size:13px}
  .subtabs button.active{background:var(--verde2);color:#fff;border-color:var(--verde2);font-weight:600}
  .subtabs.small button{padding:6px 12px;font-size:12px}

  .card{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:18px}
  .card h2{margin:0 0 4px;font-size:16px;color:var(--verde-esc)}
  .card h3{margin:0 0 12px;font-size:14px;color:var(--verde);border-bottom:2px solid var(--ouro-cl);padding-bottom:6px;display:inline-block}
  .muted{color:var(--txt2);font-size:12.5px;margin:0 0 14px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 16px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--txt2);font-weight:600}
  .field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--linha);border-radius:8px;font-size:13px;background:#fff;font-family:inherit}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--verde2);box-shadow:0 0 0 3px rgba(46,125,84,.12)}
  .checks{display:flex;flex-wrap:wrap;gap:14px;margin-top:4px}
  .checks label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--txt);font-weight:500}

  .btn{background:var(--verde2);color:#fff;border:none;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600}
  .btn:hover{background:var(--verde)}
  .btn.ghost{background:transparent;color:var(--verde);border:1px solid var(--verde2)}
  .btn.ghost:hover{background:#eef5f0}
  .btn.gold{background:var(--ouro);color:#3a2f10}
  .btn.gold:hover{background:#b8933f}
  .btn.danger{background:transparent;color:var(--erro);border:1px solid #e0b4b4}
  .btn.danger:hover{background:#fbeaea}
  .btn.sm{padding:5px 11px;font-size:12px}
  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--linha)}
  th{color:var(--txt2);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;background:#fafbf9}
  tr:hover td{background:#fafcfa}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .tag.femea{background:#fce7f0;color:#a83267}
  .tag.macho{background:#e3eefc;color:#2c5aa8}
  .tag.touro{background:#f3ead2;color:#7d6320}
  .tag.prenhe{background:#e1f4e6;color:#1f7a45}
  .tag.vazia{background:#fdeaea;color:#b23b3b}
  .tag.proc{background:#fdf3e0;color:#9a6b1a}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .kpi{background:linear-gradient(135deg,#fff,#f7faf7);border:1px solid var(--linha);border-radius:12px;padding:16px;text-align:center}
  .kpi .n{font-size:30px;font-weight:800;color:var(--verde)}
  .kpi .l{font-size:12px;color:var(--txt2);margin-top:2px}
  .kpi.gold .n{color:var(--ouro)}

  .bar{height:22px;background:#eef1ec;border-radius:12px;overflow:hidden;display:flex;margin-top:6px}
  .bar .seg{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
  .seg.pr{background:var(--ok)} .seg.vz{background:var(--erro)} .seg.pc{background:var(--ouro)}

  .numchips{display:flex;flex-wrap:wrap;gap:8px}
  .numchip{background:#eef5f0;border:1px solid #cfe3d7;color:var(--verde);padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer}
  .numchip:hover{background:var(--verde2);color:#fff}
  .numchip.first{background:var(--ouro);color:#3a2f10;border-color:var(--ouro)}
  .tourolist{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .tourocheck{display:flex;align-items:center;gap:6px;background:#f6f8f5;border:1px solid var(--linha);padding:7px 11px;border-radius:8px;font-size:13px;cursor:pointer;user-select:none}
  .tourocheck:hover{border-color:var(--verde2)}
  .tourocheck input{width:15px;height:15px;accent-color:var(--verde2)}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#20272e;color:#fff;padding:12px 20px;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:100;font-size:13.5px;opacity:0;transition:opacity .25s,bottom .25s;pointer-events:none}
  .toast.show{opacity:1;bottom:32px}
  .toast.err{background:var(--erro)} .toast.ok{background:var(--ok)}

  .empty{text-align:center;color:var(--txt2);padding:30px;font-size:13px}
  .placeholder{text-align:center;padding:50px 20px;color:var(--txt2)}
  .placeholder .ic{font-size:48px;opacity:.4}
  .flowbox{border:1px dashed var(--ouro);background:#fffdf6;border-radius:10px;padding:16px;margin-top:14px}
  .flowsteps{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .flowstep{flex:1;min-width:90px;text-align:center;padding:8px;border-radius:8px;background:#f0f2ee;color:var(--txt2);font-size:12px;font-weight:600}
  .flowstep.done{background:#e1f4e6;color:var(--ok)}
  .flowstep.cur{background:var(--verde2);color:#fff}
  .inline-list{margin:8px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .inline-list li{background:#f6f8f5;border:1px solid var(--linha);padding:6px 10px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
  .divider{height:1px;background:var(--linha);margin:16px 0}
  .modal-bg{position:fixed;inset:0;background:rgba(21,31,25,.55);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:30px 14px;overflow-y:auto}
  .modal-bg.show{display:flex}
  .modal{background:var(--card);border-radius:14px;max-width:760px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;margin:auto}
  .modal-head{background:linear-gradient(135deg,var(--verde-esc),var(--verde));color:#fff;padding:16px 20px;display:flex;align-items:center;gap:10px}
  .modal-head b{font-size:17px} .modal-head .x{margin-left:auto;background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
  .modal-head .x:hover{background:rgba(255,255,255,.3)}
  .modal-body{padding:18px 20px;max-height:70vh;overflow-y:auto}
  .modal-body h4{margin:16px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--verde2);border-bottom:1px solid var(--linha);padding-bottom:5px}
  .modal-body h4:first-child{margin-top:0}
  .dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 18px}
  .dl .it{font-size:13px} .dl .it .k{color:var(--txt2);font-size:11px;display:block} .dl .it .val{font-weight:600}
  .modal-foot{padding:12px 20px;border-top:1px solid var(--linha);display:flex;gap:10px;justify-content:flex-end;background:#fafbf9}
  .cellbtns{display:flex;gap:6px;justify-content:flex-end}
  .lnk{color:var(--verde2);cursor:pointer;font-weight:700;text-decoration:none}
  .lnk:hover{text-decoration:underline}
  .gmdbox{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
  .gmdbox-vazio{margin:6px 0 14px;font-size:13px}
  .gmd-item{flex:1;min-width:160px;background:linear-gradient(135deg,#f2f8f4,#eaf3ee);border:1px solid var(--linha);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:3px}
  .gmd-lbl{font-size:12px;color:var(--txt2);font-weight:800;text-transform:uppercase;letter-spacing:.4px}
  .gmd-val{font-size:24px;font-weight:800;line-height:1.1}
  .gmd-sub{font-size:12px;color:var(--txt2)}
  .curral .gmd-lbl{font-size:15px}
  .curral .gmd-val{font-size:32px}
  .curral .gmd-sub{font-size:14px}
  .curral .gmdbox-vazio{font-size:16px}
  details.exp{margin:14px 0 0}
  details.exp>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--verde2);font-weight:700;padding:8px 12px;background:#eef5f0;border:1px solid var(--linha);border-radius:8px}
  details.exp>summary::-webkit-details-marker{display:none}
  details.exp>summary::before{content:"▸";font-size:11px}
  details.exp[open]>summary::before{content:"▾"}
  details.exp>summary:hover{background:#e2efe7}
  details.exp>.exp-body{margin-top:8px}
  @media(max-width:640px){
    .wrap{padding:14px 10px 50px}
    header.top{padding:11px 14px;gap:8px}
    header.top h1{font-size:16px}
    header.top h1 small{font-size:9px;letter-spacing:1.5px}
    header.top .crown{font-size:20px}
    header.top .status{font-size:10px}
    header.top #conn-txt{display:none}
    .saveind{font-size:10px;padding:3px 7px}
    nav.tabs{padding:0 8px}
    nav.tabs button{padding:11px 14px;font-size:13px}
    .card{padding:14px 14px}
    .card h3{font-size:14px}
    .grid{grid-template-columns:1fr;gap:12px}
    .actions .btn{width:100%;justify-content:center}
    .databar{flex-direction:column;align-items:stretch;text-align:center}
    .databar .btn{width:100%;justify-content:center}
    .kpis{grid-template-columns:1fr 1fr}
    .modal{max-width:100%;border-radius:12px}
    .modal-foot{flex-direction:column-reverse}
    .modal-foot .btn{width:100%;justify-content:center}
    /* listas viram cartões */
    table.rt thead{display:none}
    table.rt, table.rt tbody, table.rt tr, table.rt td{display:block;width:100%}
    table.rt tr{border:1px solid var(--linha);border-radius:10px;margin-bottom:10px;padding:8px 12px;background:#fff;box-shadow:var(--shadow)}
    table.rt td{border:none;padding:5px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13.5px}
    table.rt td::before{content:attr(data-label);color:var(--txt2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
    table.rt td[data-label=""]::before,table.rt td:not([data-label])::before{content:""}
    table.rt td .cellbtns{flex-wrap:wrap;justify-content:flex-end}
    table.rt td .cellbtns .btn{flex:1;min-width:80px;justify-content:center;padding:8px}
  }
  /* Operacional / curral — letras grandes para uso no campo */
  .curral h3{font-size:26px}
  .curral h2{font-size:22px}
  .curral .muted{font-size:15px}
  .curral .field label{font-size:16px;font-weight:700}
  .curral .field input,.curral .field select,.curral .field textarea{font-size:20px;padding:12px 14px;font-weight:600;min-width:0;width:100%;max-width:100%}
  .curral .checks{gap:22px;margin-top:8px}
  .curral .checks label{font-size:20px;gap:10px;font-weight:600}
  .curral .checks input{width:26px;height:26px}
  .curral .btn{font-size:22px;padding:16px 30px}
  .curral table th{font-size:13px}
  .curral table td{font-size:18px}
  .curral .tag{font-size:15px;padding:5px 13px}
  .curral .flowbox b{font-size:20px}
  .curral .inline-list li{font-size:17px}
  .curral .divider{margin:20px 0}
</style>

<header class="top">
  <span class="crown">♛</span>
  <h1>Fazenda Realeza<small>Gestão do Rebanho</small></h1>
  <span id="save-indicator" class="saveind" title="Estado da gravação">pronto</span>
  <div class="status" title="Dados salvos no Supabase (nuvem)."><span id="conn-dot" class="dot"></span><span id="conn-txt">conectando…</span></div>

<nav class="tabs" id="main-tabs">
  <button data-tab="operacional" class="active">Operacional</button>
  <button data-tab="rebanho">Rebanho</button>
  <button data-tab="cadastros">Cadastros</button>
  <button data-tab="relatorios">Relatórios</button>
  <button data-tab="balanca">⚖️ Balança</button>
</nav>

<div class="wrap" id="app"></div>
<div class="databar">
  <span class="db-title">☁️ Supabase</span>
  <button class="btn ghost sm" onclick="exportarDB()">⬇ Baixar backup</button>
  <span class="db-hint" id="db-hint"></span>
</div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modal-bg" onclick="fecharModalBg(event)"><div class="modal" id="modal"></div></div>

<script>
// ================= CONEXÃO SUPABASE =================
// Os dados vivem no Supabase (nuvem). O app mantém um cache (LOCAL) carregado
// no início; cada gravação é espelhada no Supabase (write-through).
const SB_URL="https://kjjyscczxsymgdvbfiji.supabase.co";
const SB_KEY="sb_publishable_h-_5949kSZp_8jHgsDnBtQ_0IIclnqn";
// fetch via XMLHttpRequest — evita extensões/automação que "embrulham" o window.fetch
// e quebram com DataCloneError (postMessage de Headers). O Supabase usa este fetch.
function xhrFetch(url, opts){
  opts=opts||{};
  var alvo=(typeof url==="string")?url:(url&&url.url)||String(url);
  return new Promise(function(resolve,reject){
    var xhr=new XMLHttpRequest();
    xhr.open(opts.method||"GET", alvo, true);
    var h=opts.headers||{};
    if(h && typeof h.forEach==="function"){ h.forEach(function(v,k){ try{xhr.setRequestHeader(k,v);}catch(e){} }); }
    else { for(var k in h){ try{xhr.setRequestHeader(k,h[k]);}catch(e){} } }
    xhr.onload=function(){
      var map={}; (xhr.getAllResponseHeaders()||"").trim().split(/\r?\n/).forEach(function(line){
        var i=line.indexOf(":"); if(i>0){ map[line.slice(0,i).trim().toLowerCase()]=line.slice(i+1).trim(); }
      });
      var body=xhr.responseText;
      resolve({
        ok: xhr.status>=200 && xhr.status<300,
        status: xhr.status, statusText: xhr.statusText, url: alvo,
        headers: { get:function(k){ var v=map[String(k).toLowerCase()]; return v===undefined?null:v; },
                   has:function(k){ return String(k).toLowerCase() in map; },
                   forEach:function(cb){ for(var k in map) cb(map[k],k); } },
        text:function(){ return Promise.resolve(body); },
        json:function(){ return Promise.resolve(body?JSON.parse(body):null); }
      });
    };
    xhr.onerror=function(){ reject(new TypeError("Network request failed")); };
    xhr.ontimeout=function(){ reject(new TypeError("Network request timed out")); };
    xhr.send(opts.body!==undefined?opts.body:null);
  });
}
const RS = supabase.createClient(SB_URL, SB_KEY, { auth:{persistSession:false, autoRefreshToken:false}, global:{ fetch: xhrFetch } });
const LOCAL = { animais:[], operacoes_rebanho:[], reproducao:[], reproducao_touros:[], pastos:[], lotes:[], medicamentos:[], protocolos:[], racas:[], classificacoes:[], equipes:[] };
const TABELAS = Object.keys(LOCAL);
let _online=false;
function defaultsFor(t){
  if(t==="animais") return {arquivado:false,status:"ativo",origem:"nascimento",codigo_arquivo:null,numero_original:null,indices:{}};
  if(t==="operacoes_rebanho") return {vermifugo:false,carbunculo:false,vacina_reprodutiva:false};
  if(t==="reproducao") return {ciclo:1,fase:"aguardando",vacina_reprodutiva:false,vermifugo:false,carbunculo:false,resultado_prenhez:null};
  return {};
}
function faixaDe(m){ if(m==null) return "sem_data"; if(m<=12) return "0-12"; if(m<=24) return "13-24"; return "25+"; }
function femeaRepro(f){
  const ciclos = LOCAL.reproducao.filter(r=>r.animal_id===f.id).sort((a,b)=>b.ciclo-a.ciclo);
  const ultimo = ciclos[0]||null;
  let situacao="sem_registro";
  if(ultimo){
    if(ultimo.fase==="prenhe") situacao="prenhe";
    else if(ultimo.fase==="vazia") situacao="vazia";
    else if(ultimo.fase==="parida") situacao="parida";
    else situacao="em_processo";
  }
  return { animal_id:f.id, numero:f.numero,
    total_ciclos:ciclos.length,
    ciclos_confirmados:ciclos.filter(r=>r.resultado_prenhez!=null).length,
    situacao,
    ultimo_resultado: ultimo? (ultimo.resultado_prenhez ?? null) : null,
    ultima_fase: ultimo? ultimo.fase : null };
}
// touro de central (sêmen) não é animal físico — não conta no rebanho
function contaNoRebanho(a){ return !a.arquivado && !(a.tipo==="touro" && a.procedencia==="central"); }
function viewRows(name){
  const ativos = LOCAL.animais.filter(contaNoRebanho);
  if(name==="vw_contagem_tipo"){ const g={}; ativos.forEach(a=>g[a.tipo]=(g[a.tipo]||0)+1); return Object.keys(g).map(t=>({tipo:t,total:g[t]})); }

  if(name==="vw_femea_reproducao"){ return ativos.filter(a=>a.tipo==="femea").map(femeaRepro); }

      com_2_ou_mais_ciclos:fs.filter(f=>f.total_ciclos>=2).length }]; }
  return [];
}
class Q {
  constructor(t){ this.t=t; this.f=[]; this.op="select"; this.cols="*"; this.head=false; this.ord=null; this.lim=null; this.one=false; this.payload=null; }
  select(cols,opts){ this.op="select"; this.cols=cols||"*"; if(opts&&opts.head) this.head=true; return this; }
  insert(p){ this.op="insert"; this.payload=p; return this; }
  update(p){ this.op="update"; this.payload=p; return this; }
  eq(c,v){ this.f.push(r=>r[c]===v); return this; }
  neq(c,v){ this.f.push(r=>r[c]!==v); return this; }
  gte(c,v){ this.f.push(r=>r[c]>=v); return this; }
  order(c,o){ this.ord={c,asc:!(o&&o.ascending===false),nf:o&&o.nullsFirst}; return this; }
  limit(n){ this.lim=n; return this; }
  maybeSingle(){ this.one=true; return this; }
  single(){ this.one=true; return this; }
  then(res,rej){ return Promise.resolve(this._run()).then(res,rej); }
  _base(){ return this.t.startsWith("vw_") ? viewRows(this.t) : (LOCAL[this.t]||[]); }
  async _run(){
    if(this.op==="insert"){
      const recs=Array.isArray(this.payload)?this.payload:[this.payload]; const out=[];
      for(const r of recs){
        const doc=Object.assign({},defaultsFor(this.t),r); delete doc.id;
        if(doc.created_at===undefined) doc.created_at=new Date().toISOString();
        if(this.t==="animais" && doc.numero!=null && !doc.arquivado && LOCAL.animais.some(a=>!a.arquivado&&a.numero===doc.numero))
          return {data:null,error:{code:"23505",message:"número duplicado"}};
        const { data, error } = await RS.from(this.t).insert({doc}).select("id").single();
        if(error) return {data:null,error};
        const row=Object.assign({},doc,{id:data.id}); LOCAL[this.t].push(row); out.push(row);
      }
      flashSave();
      return {data:out,error:null};
    }
    if(this.op==="update"){
      const rows=LOCAL[this.t].filter(r=>this.f.every(fn=>fn(r)));
      for(const r of rows){
        Object.assign(r,this.payload);
        const {id, ...doc}=r;
        const { error } = await RS.from(this.t).update({doc}).eq("id",id);
        if(error) return {data:null,error};
      }
      flashSave();
      return {data:rows,error:null};
    }
    let rows=this._base().filter(r=>this.f.every(fn=>fn(r)));
    if(this.t==="reproducao_touros" && /animais\(/.test(this.cols))
      rows=rows.map(r=>Object.assign({},r,{animais: r.touro_id? {numero:(LOCAL.animais.find(a=>a.id===r.touro_id)||{}).numero}:null}));
    if(this.ord){ const {c,asc,nf}=this.ord; rows=rows.slice().sort((a,b)=>{
      let x=a[c],y=b[c]; if(x==null&&y==null)return 0; if(x==null)return nf?-1:1; if(y==null)return nf?1:-1;
      return x<y?(asc?-1:1):x>y?(asc?1:-1):0; }); }
    if(this.lim!=null) rows=rows.slice(0,this.lim);
    if(this.head) return {data:null,count:rows.length,error:null};
    if(this.one) return {data:rows[0]??null,error:null};
    return {data:rows,error:null,count:rows.length};
  }
}
function numerosLivres(limite){
  const usados=new Set(LOCAL.animais.filter(a=>!a.arquivado&&a.numero!=null).map(a=>a.numero));
  const max=Math.max(0,...usados); const out=[];
  for(let n=1;n<=Math.max(max+limite,limite)&&out.length<limite;n++) if(!usados.has(n)) out.push({numero:n});
  return out;
}
const sb = {
  from:(t)=>new Q(t),
  rpc: async (name,args)=>{
    if(name==="proximo_numero_disponivel"){ const l=numerosLivres(1); return {data:l.length?l[0].numero:1,error:null}; }
    if(name==="numeros_disponiveis"){ return {data:numerosLivres((args&&args.p_limite)||30),error:null}; }
    if(name==="arquivar_animal"){ const a=LOCAL.animais.find(x=>x.id===args.p_id);
      if(!a) return {data:null,error:{message:"não encontrado"}};
      a.numero_original=a.numero; a.codigo_arquivo="A"+(a.numero??a.id); a.numero=null; a.arquivado=true; a.status=args.p_status||"vendido";
      const {id, ...doc}=a; const { error } = await RS.from("animais").update({doc}).eq("id",id);
      flashSave(); return {data:a,error}; }
    return {data:null,error:{message:"rpc "+name+" indisponível"}};
  }
};

  const el=document.getElementById("save-indicator"); if(!el) return;

  }, 220);
}

let _lastErr=null;
async function _lerPagina(t, from, page){
  let err;
  for(let tent=0; tent<4; tent++){
    const { data, error } = await RS.from(t).select("id,doc").range(from, from+page-1);
    if(!error) return data||[];
    err=error; await new Promise(r=>setTimeout(r, 500*(tent+1)));
  }
  throw err;
}
async function carregarDoSupabase(){
  for(const t of TABELAS){
    let from=0; const page=1000; let all=[];
    while(true){
      const data = await _lerPagina(t, from, page);
      all = all.concat(data);
      if(data.length < page) break;
      from += page;
    }
    LOCAL[t] = all.map(r=>Object.assign({}, r.doc, {id:r.id}));
  }
}
function msgErro(e){
  if(!e) return "falha de rede";
  return e.message || e.error_description || e.details || e.hint || (typeof e==="string"?e:JSON.stringify(e));
}
function renderErroConexao(){
  const el=$("#save-indicator"); if(el){ el.textContent="offline"; el.className="saveind mem"; }
  app.innerHTML=`<div class="card placeholder">

    <p class="muted">O Supabase não respondeu (${esc(msgErro(_lastErr))}). Isso costuma ser temporário — tente de novo.</p>
    <div class="actions" style="justify-content:center;margin-top:10px"><button class="btn" onclick="iniciarApp()">Tentar novamente</button></div>
  </div>`;
}
async function iniciarApp(){
  const el=$("#save-indicator"); if(el){ el.innerHTML='<span class="pulse"></span>carregando…'; el.className="saveind saving"; }
  try{ await carregarDoSupabase(); _online=true; _lastErr=null; }
  catch(e){ _online=false; _lastErr=e; console.error("Supabase:", msgErro(e), e); }
  checkConn();
  if(_online){ if(el){ el.textContent="pronto"; el.className="saveind"; } render(); }
  else { renderErroConexao(); }
}

    + `</tbody></table></div></div>`;

function coletarIndices(){
  var ind={};
  INDICES_TOURO.forEach(function(par){ var c=par[0],k=idxKey(c);
    var d=document.getElementById("idx_"+k), e=document.getElementById("ide_"+k);
    var dv=(d&&d.value.trim()!=="")?parseFloat(d.value):null;
    var ev=(e&&e.value.trim()!=="")?parseFloat(e.value):null;
    if(dv!=null||ev!=null) ind[c]={dep:dv, de:ev};
  });
  return ind;
}
function fichaIndices(ind){
  ind=ind||{};

    + linhas.map(function(par){ var c=par[0],n=par[1],o=ind[c];
        return `<tr><td><b>${c}</b> <span class="muted">${n}</span></td><td>${o.dep!=null?o.dep:"—"}</td><td>${o.de!=null?o.de:"—"}</td></tr>`; }).join("")

}

async function resolverGenealogia(maeNum){
  // retorna {mae_id, pai_id, pai_ref} a partir do nº da mãe
  const res={mae_id:null,pai_id:null,pai_ref:null};
  if(!maeNum) return res;
  const { data:mae } = await sb.from("animais").select("id").eq("numero",parseInt(maeNum)).eq("arquivado",false).maybeSingle();
  if(!mae) return res;
  res.mae_id=mae.id;
  // última prenhez confirmada da mãe
  const { data:rep } = await sb.from("reproducao").select("id").eq("animal_id",mae.id).eq("resultado_prenhez",true).order("ciclo",{ascending:false}).limit(1).maybeSingle();
  if(rep){
    const { data:t } = await sb.from("reproducao_touros").select("touro_id,touro_nome").eq("reproducao_id",rep.id).limit(1).maybeSingle();
    if(t){ res.pai_id=t.touro_id||null; res.pai_ref=t.touro_nome||null; }
  }
  return res;
}

function gmdRebanhoStats(){
  const ativos=(LOCAL.animais||[]).filter(contaNoRebanho);
  const totais=[];
  for(const a of ativos){
    const ops=(LOCAL.operacoes_rebanho||[]).filter(o=>o.animal_id===a.id);
    const g=calcGMD(ops);
    if(g.n>=2 && g.total!=null) totais.push(g.total);
  }
  if(!totais.length) return {n:0, media:null};
  return {n:totais.length, media:Math.round(totais.reduce((s,v)=>s+v,0)/totais.length), min:Math.min(...totais), max:Math.max(...totais)};
}
function cardGMDRebanho(){
  const gr=gmdRebanhoStats();
  const corpo = gr.n
    ? `<div class="gmdbox"><div class="gmd-item">
         <span class="gmd-lbl">GMD Total médio</span>
         <span class="gmd-val" style="color:${gr.media>=0?'#1f7a45':'#b23b3b'}">${(gr.media>0?'+':'')+gr.media} g/dia</span>
         <span class="gmd-sub">${gr.n} ${gr.n>1?'animais':'animal'} com 2+ pesagens${gr.min!==gr.max?(' · variação de '+gr.min+' a '+gr.max+' g/dia'):''}</span>
       </div></div>`
    : `<p class="muted">Ainda não há animais com 2 ou mais pesagens. Assim que houver uma segunda pesagem, a média do rebanho aparece aqui.</p>`;
  return `<div class="card"><h3>GMD Total médio do rebanho</h3>
    <p class="muted">Média do ganho diário (1ª pesagem até a última) dos animais da fazenda.</p>${corpo}</div>`;
}

async function lerBalancaBLE(){
  const logEl=document.getElementById("bal-log");
  const log=(m)=>{ if(logEl){ logEl.style.display="block"; logEl.textContent+=(logEl.textContent?"\n":"")+m; logEl.scrollTop=logEl.scrollHeight; } };
  const parseNum=(t)=>{ const m=String(t).match(/-?\d+(?:[.,]\d+)?/); return m?parseFloat(m[0].replace(",",".")):null; };
  const setPeso=(v)=>{ const inp=document.getElementById("mo_peso"); if(inp){ inp.value=v; inp.style.background="#c8f5d0"; } toast("Peso lido: "+v+" kg","ok"); log("==> PESO: "+v+" kg"); };
  if(!navigator.bluetooth){ toast("Bluetooth não suportado aqui. Use o Chrome no Android.","err"); log("navigator.bluetooth indisponível — use Chrome no Android."); return; }
  try{
    log("Escolha a balança na lista…");
    const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true, optionalServices:[0x181D,0xFFE0,0xFFF0,0xFEE0,"6e400001-b5a3-f393-e0a9-e50e24dcca9e"]});
    log("Conectando: "+(dev.name||"dispositivo")+"…");
    const server=await dev.gatt.connect();
    dev.addEventListener('gattserverdisconnected',()=>log("Balança desconectada."));
    // 1) padrão Bluetooth de balança (Weight Scale 0x181D / 0x2A9D)
    try{
      const s=await server.getPrimaryService(0x181D);
      const c=await s.getCharacteristic(0x2A9D);
      await c.startNotifications();
      c.addEventListener('characteristicvaluechanged',e=>{ const d=e.target.value; const f=d.getUint8(0); const raw=d.getUint16(1,true); const kg=(f&1)?raw*0.01*0.453592:raw*0.005; setPeso(Math.round(kg*10)/10); });
      log("Conectado (balança padrão). Pese o animal.");
      return;
    }catch(_){ log("(sem serviço padrão de balança — tentando modo serial/geral)"); }
    // 2) modo geral: escuta os canais conhecidos que notificam
    const svcs=await server.getPrimaryServices();
    let achou=false;
    for(const s of svcs){
      let chars=[]; try{ chars=await s.getCharacteristics(); }catch(_){}
      for(const c of chars){
        if(c.properties.notify||c.properties.indicate){
          try{
            await c.startNotifications(); achou=true;
            c.addEventListener('characteristicvaluechanged',e=>{
              const d=e.target.value; let txt=""; try{txt=new TextDecoder().decode(d);}catch(_){}
              const bytes=[]; for(let i=0;i<d.byteLength;i++) bytes.push(d.getUint8(i));
              log("["+c.uuid.slice(4,8)+"] \""+txt.replace(/[\r\n]/g,"·")+"\" ["+bytes.join(" ")+"]");
              const n=parseNum(txt); if(n!=null && n>0 && n<3000) setPeso(Math.round(n*10)/10);
            });
          }catch(_){}
        }
      }
    }
    if(achou) log("Conectado. Suba um animal na balança e observe o que aparece aqui.");
    else log("Conectado, mas sem canal de dados reconhecido. Me mande o modelo/UUID (app nRF Connect) que eu adiciono.");
  }catch(e){
    const msg=e&&e.message?e.message:String(e);
    log("Fim: "+msg);
    if(!/cancel/i.test(msg)) toast("Bluetooth: "+msg,"err");
  }
}

function diffDias(d1,d2){ return Math.round((new Date(d2)-new Date(d1))/86400000); }
function calcGMD(ops){
  const ps=(ops||[]).filter(o=>o.peso!=null && o.data && !isNaN(parseFloat(o.peso)))
    .map(o=>({data:o.data, peso:parseFloat(o.peso)}))
    .sort((a,b)=> a.data<b.data?-1:a.data>b.data?1:0);
  if(ps.length<2) return {n:ps.length};
  const prim=ps[0], ult=ps[ps.length-1], penult=ps[ps.length-2];
  const dT=diffDias(prim.data,ult.data), dP=diffDias(penult.data,ult.data);
  return { n:ps.length, prim, ult, penult, dT, dP,
    total: dT>0? Math.round((ult.peso-prim.peso)/dT*1000): null,
    parcial: dP>0? Math.round((ult.peso-penult.peso)/dP*1000): null };
}
function gmdBox(ops){
  const g=calcGMD(ops);
  if(g.n<2) return `<div class="gmdbox-vazio muted">GMD: precisa de pelo menos 2 pesagens para calcular (registradas: ${g.n}).</div>`;
  const fmtG=v=> v==null?"—":((v>0?"+":"")+v+" g/dia");
  const cor=v=> v==null?"#6b7280": v>=0?"#1f7a45":"#b23b3b";
  return `<div class="gmdbox">
    <div class="gmd-item"><span class="gmd-lbl">GMD Total</span>
      <span class="gmd-val" style="color:${cor(g.total)}">${fmtG(g.total)}</span>
      <span class="gmd-sub">1ª→última: ${g.prim.peso}→${g.ult.peso} kg em ${g.dT} dia(s)</span></div>
    <div class="gmd-item"><span class="gmd-lbl">GMD Parcial</span>
      <span class="gmd-val" style="color:${cor(g.parcial)}">${fmtG(g.parcial)}</span>
      <span class="gmd-sub">últimas 2: ${g.penult.peso}→${g.ult.peso} kg em ${g.dP} dia(s)</span></div>
  </div>`;
}

function coberturaTxt(c){

// Previsão de parto: IATF = diagnóstico + 225 dias; monta natural = diagnóstico + 220 dias
function diasGestacaoPos(tipo){ return tipo==="iatf" ? 225 : 220; }
function calcPrevisaoParto(r){
  if(r && r.resultado_prenhez!==true && r.fase!=="prenhe") return null;
  const base = r && r.data_diagnostico;
  if(!base) return (r&&r.data_prevista_parto)||null;
  const d=new Date(base+"T00:00:00"); d.setDate(d.getDate()+diasGestacaoPos(r.tipo));
  return d.toISOString().slice(0,10);
}

function histReproducao(ciclos, editable){
  if(!ciclos.length) return `<p class="muted">Sem registros de reprodução.</p>`;

function _balDetect(line){
  const c=[[';',line.split(';').length],[',',line.split(',').length],['\t',line.split('\t').length],[' ',line.trim().split(/\s+/).length]];
  c.sort((a,b)=>b[1]-a[1]); return c[0][1]>1?c[0][0]:',';
}
function _balSplit(line,d){
  if(d===' ') return line.trim().split(/\s+/);
  const out=[]; let cur='',q=false;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(q){ if(ch=='"'){ if(line[i+1]=='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch=='"') q=true; else if(ch===d){ out.push(cur); cur=''; } else cur+=ch; } }
  out.push(cur); return out.map(s=>s.trim());
}
function balancaParse(text){
  const linhas=text.replace(/\r/g,'').split('\n').filter(l=>l.trim().length);
  if(!linhas.length){ toast('Arquivo/dados vazios.','err'); return; }
  const d=_balDetect(linhas[0]);
  const rows=linhas.map(l=>_balSplit(l,d)).filter(r=>r.length>=2);
  if(!rows.length){ toast('Não achei colunas no arquivo.','err'); return; }
  const primeira=rows[0];
  const temCab=primeira.some(c=>c && isNaN(parseFloat(String(c).replace(',','.'))));
  let header,dados;
  if(temCab){ header=primeira.map((c,i)=>c||('Coluna '+(i+1))); dados=rows.slice(1); }
  else { header=primeira.map((_,i)=>'Coluna '+(i+1)); dados=rows; }
  BAL={header,dados};
  const acha=re=>{ for(let i=0;i<header.length;i++) if(re.test(header[i])) return i; return -1; };
  let cNum=acha(/vid|visual|n[uú]?mero|number|animal|brinco/i); if(cNum<0) cNum=0;
  let cPeso=acha(/peso|weight|\bkg\b|\bwt\b/i); if(cPeso<0) cPeso=header.length>1?header.length-1:0;
  const opts=sel=>header.map((h,i)=>`<option value="${i}" ${i===sel?'selected':''}>${esc(h)}</option>`).join('');
  $('#bal-map').innerHTML=`
    <div class="divider"></div>
    <p class="muted">Encontrei ${dados.length} linha(s) e ${header.length} coluna(s). Confira as colunas:</p>

    </div>`;
  balancaPreview();
}
function balancaArquivo(input){

function _balNum(s){ const m=String(s).match(/\d+/); return m?parseInt(m[0],10):null; }
function _balPeso(s){ const m=String(s).match(/-?\d+(?:[.,]\d+)?/); return m?parseFloat(m[0].replace(',','.')):null; }
function balancaLinhas(){

function intervaloVazias6m(ciclos){

    .map(c=>c.data_diagnostico||c.data_cobertura||((c.created_at||"").slice(0,10)))
    .filter(Boolean).sort();
  for(let i=0;i<vz.length;i++) for(let j=i+1;j<vz.length;j++){
    const meses=(new Date(vz[j])-new Date(vz[i]))/(1000*60*60*24*30.44);
    if(meses<=6) return {ok:true, de:vz[i], ate:vz[j], meses:Math.round(meses*10)/10};
  }
  return {ok:false};
}

async function checkNumeroLivre(numero, exceptId){
  if(numero==null) return true;
  let q = sb.from("animais").select("id").eq("numero",numero).eq("arquivado",false);
  if(exceptId) q=q.neq("id",exceptId);
  const { data } = await q.limit(1);
  return !(data && data.length);
}
async function validarAnimal(rec, exceptId){
  const errors=[], warnings=[];
  const hoje=new Date().toISOString().slice(0,10);
  // número obrigatório e único
  if(rec.numero==null || isNaN(rec.numero)) errors.push("Informe o número do animal.");
  else if(rec.numero<=0) errors.push("O número deve ser maior que zero.");
  else if(!(await checkNumeroLivre(rec.numero, exceptId))) errors.push(`Número ${rec.numero} já está em uso por outro animal ativo.`);
  // datas conforme origem
  if(rec.tipo==="macho" && rec.origem==="compra"){
    if(!rec.data_compra) errors.push("Informe a data da compra.");
  } else if(!rec.data_nascimento){
    warnings.push("Data de nascimento não informada (recomendada para calcular idade).");
  }
  // regras por tipo
  if(rec.tipo==="touro" && !rec.procedencia) errors.push("Informe a procedência do touro.");
  // datas no futuro
  if(rec.data_nascimento && rec.data_nascimento>hoje) errors.push("Data de nascimento não pode ser no futuro.");
  if(rec.data_compra && rec.data_compra>hoje) errors.push("Data de compra não pode ser no futuro.");
  return {errors, warnings};
}
async function passouValidacao(rec, exceptId, silent){
  const {errors,warnings}=await validarAnimal(rec, exceptId);
  if(errors.length){ toast(errors[0], "err"); return false; }
  if(warnings.length){
    if(silent){ toast("Aviso: "+warnings[0]); }
    else if(!confirm("Atenção:\n\n• "+warnings.join("\n• ")+"\n\nDeseja salvar mesmo assim?")) return false;
  }
  return true;
}
function erroInsert(error, numero){
  return toast(error.code==="23505" ? `Número ${numero} já está em uso.` : "Erro: "+error.message, "err");
}

// MODAL / FICHA / EDIÇÃO
// ============================================================
let AUTOSAVE=true;
function setAutosave(v){ AUTOSAVE=v; toast(v?"Auto-salvar ligado":"Auto-salvar desligado", v?"ok":""); }
function abrirModal(html){ $("#modal").innerHTML=html; $("#modal-bg").classList.add("show"); }
function fecharModal(){ $("#modal-bg").classList.remove("show"); }
function fecharModalRender(){ fecharModal(); render(); }
function fecharModalBg(e){ if(e.target.id==="modal-bg") fecharModalRender(); }
function setEditStatus(txt, cls){ const el=document.getElementById("edit-status"); if(el){ el.textContent=txt; el.className="savest "+(cls||"idle"); } }
const nomeTipo={touro:"Touro",femea:"Fêmea",macho:"Macho"};
function it(k,v){ return `<div class="it"><span class="k">${k}</span><span class="val">${v??"—"}</span></div>`; }

async function abrirFicha(id){
  abrirModal(`<div class="modal-head"><b>Carregando ficha…</b><button class="x" onclick="fecharModal()">✕</button></div>`);
  const { data:a } = await sb.from("animais").select("*").eq("id",id).maybeSingle();
  if(!a){ toast("Animal não encontrado","err"); return fecharModal(); }
  let maeTxtv=a.mae_ref, paiTxtv=a.pai_ref;
  if(a.mae_id){ const {data:mm}=await sb.from("animais").select("numero,codigo_arquivo").eq("id",a.mae_id).maybeSingle(); if(mm) maeTxtv="nº "+(mm.numero??mm.codigo_arquivo); }
  if(a.pai_id){ const {data:pp}=await sb.from("animais").select("numero,codigo_arquivo").eq("id",a.pai_id).maybeSingle(); if(pp) paiTxtv="nº "+(pp.numero??pp.codigo_arquivo); }
  const { data:ops } = await sb.from("operacoes_rebanho").select("*").eq("animal_id",id).order("data",{ascending:false});
  let repHtml="";
  if(a.tipo==="femea"){ const {data:cic}=await sb.from("reproducao").select("*").eq("animal_id",id).order("ciclo",{ascending:false}); repHtml=`<h4>Reprodução</h4>${histReproducao(cic||[])}`; }

  const dados=`<h4>Dados</h4><div class="dl">
    ${it("Número",`<b>${a.numero??a.codigo_arquivo??"—"}</b>`)}
    ${a.tipo==="touro"?it("Nome",esc(a.nome)):""}
    ${it("Tipo",`<span class="tag ${a.tipo}">${a.tipo}</span>`)}
    ${a.tipo==="touro"?it("Procedência",a.procedencia==="central"?"Central":"Fazenda"):""}
    ${a.tipo!=="touro"?it("Categoria",esc(categoriaAnimal(a))):""}
    ${it("Raça",esc(a.raca))}
    ${it("Nascimento",fmtDate(a.data_nascimento))}
    ${it("Idade",idadeTxt(a.data_nascimento))}
    ${a.origem==="compra"?it("Compra",fmtDate(a.data_compra)):it("Origem","Nascimento")}
    ${it("Registro",esc(a.registro))}
    ${it("Class. genética",esc(a.classificacao_genetica))}
    ${a.stayability!=null?it("Stayability",a.stayability):""}
    ${a.peso!=null?it("Peso atual",a.peso+" kg"):""}
    ${a.peso_nascimento!=null?it("Peso nasc.",a.peso_nascimento+" kg"):""}
    ${a.peso_desmame!=null?it("Peso desmame",a.peso_desmame+" kg"):""}
    ${it("Data de inclusão", fmtDateTime(a.created_at))}
  </div>${a.observacoes?`<p class="muted" style="margin-top:10px">📝 ${esc(a.observacoes)}</p>`:""}`;

  const genealogia=`<h4>Genealogia</h4><div class="dl">
    ${it("Pai",esc(paiTxtv))}
    ${it("Mãe",esc(maeTxtv))}
    ${a.tipo==="touro"?it("Avô paterno",esc(a.avo_paterno)):""}
    ${a.tipo==="touro"?it("Avó paterna",esc(a.ava_paterna)):""}
    ${a.tipo==="touro"?it("Avô materno",esc(a.avo_materno)):""}
    ${a.tipo==="touro"?it("Avó materna",esc(a.ava_materna)):""}
  </div>`;

  let manejo=`<h4>Manejo e pesos</h4>`;
  if(ops&&ops.length){
    manejo+=gmdBox(ops);
    manejo+=`<div style="overflow-x:auto"><table><thead><tr><th>Data</th><th>Peso</th><th>Sanidade</th></tr></thead><tbody>`+
      ops.map(o=>{const meds=[o.vermifugo_nome?("Vermífugo: "+o.vermifugo_nome):(o.vermifugo?"Vermífugo":null),o.carbunculo?"Carbúnculo":null,o.vacina_reprodutiva?"V. reprodutiva":null,o.outros_medicamentos].filter(Boolean).join(", ");
        return `<tr><td>${fmtDate(o.data)}</td><td>${o.peso?o.peso+" kg":"—"}</td><td>${esc(meds)||"—"}</td></tr>`;}).join("")+
      `</tbody></table></div>`;
  } else manejo+=`<p class="muted">Sem manejos registrados.</p>`;

  abrirModal(`
    <div class="modal-head"><b>${nomeTipo[a.tipo]} nº ${a.numero??a.codigo_arquivo??"—"}</b><button class="x" onclick="fecharModal()">✕</button></div>
    <div class="modal-body">${dados}${genealogia}${a.tipo==="touro"?fichaIndices(a.indices):""}${manejo}${repHtml}</div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="fecharModalRender()">Fechar</button>
      <button class="btn gold" onclick="editarAnimal('${a.id}')">Editar</button>
    </div>`);
}

function campo(id,label,val,type="text",extra=""){
  return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${val!=null?esc(val):""}" ${extra}></div>`;
}
async function editarAnimal(id){
  const { data:a } = await sb.from("animais").select("*").eq("id",id).maybeSingle();
  if(!a){ toast("Animal não encontrado","err"); return; }
  // nº da mãe para reeditar (quando vinculada)
  let maeNum=a.mae_ref||"";
  if(a.mae_id){ const {data:mm}=await sb.from("animais").select("numero").eq("id",a.mae_id).maybeSingle(); if(mm&&mm.numero!=null) maeNum=mm.numero; }
  let campos=campo("e_numero","Número",a.numero,"number")+campo("e_nasc","Data de nascimento",a.data_nascimento,"date");
  if(a.tipo==="touro"){
    campos+=campo("e_nome","Nome do touro",a.nome)+`<div class="field"><label>Procedência</label><select id="e_proc"><option value="fazenda"${a.procedencia==="fazenda"?" selected":""}>Touro Fazenda</option><option value="central"${a.procedencia==="central"?" selected":""}>Central</option></select></div>`
      +campo("e_registro","Registro/Central",a.registro)+campoSelect("e_raca","Raça",optRacas(a.raca))+campoSelect("e_class","Class. genética",optClass(a.classificacao_genetica))
      +campo("e_pai","Pai",a.pai_ref)+campo("e_mae","Mãe",a.mae_ref)
      +campo("e_avop","Avô paterno",a.avo_paterno)+campo("e_avap","Avó paterna",a.ava_paterna)
      +campo("e_avom","Avô materno",a.avo_materno)+campo("e_avam","Avó materna",a.ava_materna)
      +campo("e_peso","Peso atual (kg)",a.peso,"number",'step="0.1"');
  } else if(a.tipo==="femea"){
    campos+=campo("e_maenum","Nº da mãe (matriz)",maeNum,"number")+campoSelect("e_raca","Raça",optRacas(a.raca))+campoSelect("e_class","Class. genética",optClass(a.classificacao_genetica))+campo("e_registro","Registro",a.registro)
      +campo("e_peso","Peso (kg)",a.peso,"number",'step="0.1"');
  } else {
    campos+=`<div class="field"><label>Origem</label><select id="e_origem" onchange="document.getElementById('e_compra_wrap').style.display=this.value==='compra'?'flex':'none'">
         <option value="nascimento"${a.origem==="nascimento"?" selected":""}>Nascimento</option>
         <option value="compra"${a.origem==="compra"?" selected":""}>Compra</option></select></div>`
      +`<div class="field" id="e_compra_wrap" style="display:${a.origem==="compra"?"flex":"none"}"><label>Data da compra</label><input id="e_compra" type="date" value="${a.data_compra||""}"></div>`
      +campo("e_maenum","Nº da mãe",maeNum,"number")+campoSelect("e_raca","Raça",optRacas(a.raca))+campo("e_registro","Registro",a.registro)+campoSelect("e_class","Class. genética",optClass(a.classificacao_genetica))
      +campo("e_pnasc","Peso nascimento (kg)",a.peso_nascimento,"number",'step="0.1"')+campo("e_desm","Peso desmame (kg)",a.peso_desmame,"number",'step="0.1"')+campo("e_peso","Peso atual (kg)",a.peso,"number",'step="0.1"');
  }
  abrirModal(`
    <div class="modal-head"><b>Editar ${nomeTipo[a.tipo]} nº ${a.numero??"—"}</b>
      <span id="edit-status" class="savest ok">salva automático</span>
      <button class="x" onclick="fecharModalRender()">✕</button></div>
    <div class="modal-body" onchange="autoEdit('${a.id}','${a.tipo}')"><div class="grid">${campos}</div>
      ${a.tipo==="touro"?formIndices(a.indices):""}
      <div class="field" style="margin-top:12px"><label>Observações</label><textarea id="e_obs" rows="2">${esc(a.observacoes)||""}</textarea></div>
      <p class="muted" style="margin-top:10px">Cada campo grava sozinho ao sair dele. Você também pode usar o botão abaixo.</p>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="abrirFicha('${a.id}')">Ver ficha</button>
      <button class="btn" onclick="salvarEdicao('${a.id}','${a.tipo}')">Salvar e fechar</button>
    </div>`);
}
function autoEdit(id, tipo){ if(AUTOSAVE) salvarEdicao(id, tipo, true); }
async function salvarEdicao(id, tipo, silent){
  const v=x=>{const el=document.getElementById(x); return el?el.value.trim():"";};
  const rec={ tipo,
    numero: v("e_numero")?parseInt(v("e_numero")):null,
    data_nascimento: v("e_nasc")||null,
    raca: v("e_raca")||null,
    classificacao_genetica: v("e_class")||null,
    registro: v("e_registro")||null,
    peso: v("e_peso")?parseFloat(v("e_peso")):null,
    observacoes: v("e_obs")||null,
  };
  if(tipo==="touro"){
    Object.assign(rec,{nome:v("e_nome")||null, procedencia:v("e_proc"), pai_ref:v("e_pai")||null, mae_ref:v("e_mae")||null,
      avo_paterno:v("e_avop")||null, ava_paterna:v("e_avap")||null, avo_materno:v("e_avom")||null, ava_materna:v("e_avam")||null,
      indices: coletarIndices()});
  } else if(tipo==="femea"){
    const gen=await resolverGenealogia(v("e_maenum"));
    Object.assign(rec,{mae_id:gen.mae_id, mae_ref:(!gen.mae_id&&v("e_maenum"))?v("e_maenum"):null, pai_id:gen.pai_id, pai_ref:gen.pai_ref});
  } else {
    const gen=await resolverGenealogia(v("e_maenum"));
    Object.assign(rec,{origem:v("e_origem"), data_compra:v("e_compra")||null, mae_id:gen.mae_id, mae_ref:(!gen.mae_id&&v("e_maenum"))?v("e_maenum"):null, pai_id:gen.pai_id, pai_ref:gen.pai_ref,
      peso_nascimento:v("e_pnasc")?parseFloat(v("e_pnasc")):null, peso_desmame:v("e_desm")?parseFloat(v("e_desm")):null});
  }
  if(silent) setEditStatus("salvando…","idle");
  if(!(await passouValidacao(rec, id, silent))){ if(silent) setEditStatus("corrija para salvar","err"); return; }
  delete rec.tipo;
  const { error } = await sb.from("animais").update(rec).eq("id",id);
  if(error){ if(silent) setEditStatus("erro ao salvar","err"); return erroInsert(error, rec.numero); }
  if(silent){ setEditStatus("salvo ✓","ok"); }
  else { toast("Alterações salvas!","ok"); fecharModalRender(); }
}
