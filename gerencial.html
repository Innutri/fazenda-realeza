<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fazenda Realeza — Gerencial</title>
<style>
  :root{
    --verde:#1f5c3d; --verde2:#2e7d54; --verde-esc:#153f2a;
    --ouro:#c9a44a; --ouro-cl:#e6cf8a;
    --bg:#f4f6f2; --card:#ffffff; --linha:#e2e7df;
    --txt:#20272e; --txt2:#5d6b62; --erro:#b23b3b; --ok:#2e7d54;
    --serie1:#1a9d5c; --serie2:#8a6410;
    --shadow:0 1px 3px rgba(20,40,30,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
  a{color:var(--verde2)}

  header.top{background:linear-gradient(135deg,var(--verde-esc),var(--verde));color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  header.top .crown{font-size:24px}
  header.top h1{font-size:19px;font-weight:800;line-height:1.1}
  header.top h1 small{display:block;font-size:10.5px;font-weight:400;color:var(--ouro-cl);letter-spacing:2px;text-transform:uppercase}
  .badge{background:var(--ouro);color:#2e2508;font-size:10.5px;font-weight:800;letter-spacing:1px;padding:5px 11px;border-radius:20px;text-transform:uppercase}
  .topright{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:#dfe9e2}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--verde2);color:#fff;border:none;border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff}
  .btn.gold{background:var(--ouro);color:#2e2508}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* SHELL */
  .shell{display:flex;min-height:calc(100vh - 60px)}
  nav.side{width:216px;flex-shrink:0;background:#fff;border-right:1px solid var(--linha);padding:14px 10px;display:flex;flex-direction:column;gap:3px}
  .navitem{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--txt);text-decoration:none;position:relative}
  .navitem .ic{font-size:18px;width:22px;text-align:center}
  .navitem:hover{background:#f2f6f2}
  .navitem.active{background:var(--verde);color:#fff}
  .navitem .lock{margin-left:auto;font-size:10px;opacity:.6}
  .navitem.active .lock{opacity:.9}
  .side .grp{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--txt2);padding:12px 12px 4px;font-weight:700}
  main.main{flex:1;min-width:0;padding:22px}
  @media(max-width:900px){
    .shell{flex-direction:column}
    nav.side{width:100%;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--linha);padding:8px;gap:6px}
    nav.side .grp{display:none}
    .navitem{flex-direction:column;gap:3px;padding:8px 10px;font-size:11px;min-width:74px;text-align:center;white-space:nowrap}
    .navitem .ic{font-size:20px}
    .navitem .lock{position:absolute;top:4px;right:6px;margin:0}
    main.main{padding:14px 12px}
  }

  .muted{color:var(--txt2);font-size:13px}
  .card{background:var(--card);border:1px solid var(--linha);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
  .card h3{font-size:15px;color:var(--verde);margin-bottom:4px}
  .card .sub{color:var(--txt2);font-size:12.5px;margin-bottom:14px}
  .pgtitle{font-size:21px;font-weight:800;color:var(--verde);margin:2px 0 4px}
  .pgsub{color:var(--txt2);font-size:13.5px;margin-bottom:18px}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:900px){ .cols2{grid-template-columns:1fr} }

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .kpi{background:linear-gradient(135deg,#fff,#f7faf7);border:1px solid var(--linha);border-radius:12px;padding:14px;text-align:center}
  .kpi .v{font-size:26px;font-weight:700;color:var(--txt)}
  .kpi.hero .v{font-size:46px;font-weight:800;color:var(--verde)}
  .kpi .l{font-size:12px;color:var(--txt2);margin-top:2px}
  .kpi .d{font-size:11.5px;margin-top:4px;color:var(--txt2)}
  @media(max-width:640px){ .kpi .v{font-size:22px} .kpi.hero .v{font-size:36px} }

  .chartbox{position:relative}
  .chartbox svg{width:100%;height:auto;display:block}
  .legend{display:flex;gap:16px;align-items:center;margin:2px 0 10px;font-size:12.5px;color:var(--txt2)}
  .legend .k{display:inline-flex;align-items:center;gap:6px}
  .legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
  .tip{position:absolute;pointer-events:none;background:#20272e;color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .12s;z-index:5}
  .tip b{color:#ffd98a}
  details.tbl{margin-top:10px}
  details.tbl>summary{cursor:pointer;font-size:12px;color:var(--verde2);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--linha)}
  th{color:var(--txt2);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;background:#fafbf9}
  .tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11.5px;font-weight:700;background:#fdeaea;color:#b23b3b}
  .finabas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .finabas button{background:#fff;border:1px solid var(--linha);border-radius:20px;padding:8px 14px;font-weight:700;cursor:pointer;color:#20272e}
  .finabas button.on{background:#2e7d54;border-color:#2e7d54;color:#fff}
  .finhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .num{text-align:right}
  .empty{color:var(--txt2);text-align:center;padding:18px;font-size:13.5px}
  .num{font-variant-numeric:tabular-nums}
  .exports{display:flex;gap:10px;flex-wrap:wrap}
  @media(max-width:640px){ .exports .btn{flex:1;justify-content:center} }

  /* ribbon "a ativar" + prévia bloqueada */
  .ribbon{background:#fff8e6;border:1px solid var(--ouro-cl);color:#6b5313;border-radius:12px;padding:13px 16px;font-size:13.5px;margin-bottom:18px;line-height:1.5}
  .ribbon b{color:#5a4410}
  .preview{position:relative}
  .preview .lockover{position:absolute;inset:0;background:transparent;z-index:2;cursor:not-allowed}
  .preview .demo{opacity:.62;pointer-events:none;filter:saturate(.85)}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12px;color:var(--txt2);font-weight:600;margin-bottom:4px}
  .field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--linha);border-radius:8px;font-size:14px;background:#fff;font-family:inherit}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){ .grid{grid-template-columns:1fr} }
  .money{font-variant-numeric:tabular-nums;font-weight:700}
  .pos{color:var(--ok)} .neg{color:var(--erro)}
  .willdo{font-size:13px;color:var(--txt2);line-height:1.6;margin-top:6px}
  .willdo li{margin-left:18px;margin-bottom:3px}

  #estado{padding:60px 20px;text-align:center}
  #estado .ic{font-size:40px;margin-bottom:10px}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid var(--linha);border-top-color:var(--verde2);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* login */
  #login{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:20px}
  .loginbox{background:#fff;border:1px solid var(--linha);border-radius:16px;box-shadow:0 6px 24px rgba(20,40,30,.10);padding:30px 28px;width:100%;max-width:380px}
  .loginbox .cr{font-size:34px;text-align:center;margin-bottom:6px}
  .loginbox h2{text-align:center;color:var(--verde);font-size:19px;margin-bottom:4px}
  .loginbox p.sub{text-align:center;color:var(--txt2);font-size:13px;margin-bottom:18px}
  .loginbox .btn{width:100%;justify-content:center;font-size:15px;padding:12px;margin-top:6px}
  .loginerr{background:#fdeaea;color:#b23b3b;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;display:none}
  .userchip{display:flex;align-items:center;gap:8px;font-size:12px;color:#dfe9e2}
  .userchip b{color:#fff}
  /* --- relatório de rebanho (portado do app de campo) --- */
  .kpi .n{font-size:30px;font-weight:800;color:var(--verde)}
  .kpi.gold .n{color:var(--ouro)}
  .tag.femea{background:#fce7f0;color:#a83267}
  .tag.macho{background:#e3eefc;color:#2c5aa8}
  .tag.touro{background:#f3ead2;color:#7d6320}
  .tag.prenhe{background:#e1f4e6;color:#1f7a45}
  .tag.vazia{background:#fdeaea;color:#b23b3b}
  .relnav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .relnav a{text-decoration:none;background:var(--ouro);border:1px solid #b28f35;color:#2e2508;font-size:12px;font-weight:700;padding:7px 12px;border-radius:20px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .relnav a:active,.relnav a:hover{background:var(--verde2);border-color:var(--verde2);color:#fff}
  .card[id]{scroll-margin-top:14px}
  .bar{height:22px;background:#eef1ec;border-radius:12px;overflow:hidden;display:flex;margin-top:6px}
  .bar .seg{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
  .seg.pr{background:var(--ok)} .seg.vz{background:var(--erro)} .seg.pc{background:var(--ouro)}
  .numchips{display:flex;flex-wrap:wrap;gap:8px}
  .numchip{background:#eef5f0;border:1px solid #cfe3d7;color:var(--verde);padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px}
  table.rt th,table.rt td{text-align:left}
  details.exp{margin:14px 0 0}
  details.exp>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--verde2);font-weight:700;padding:8px 12px;background:#eef5f0;border:1px solid var(--linha);border-radius:8px}
  details.exp>summary::-webkit-details-marker{display:none}
  details.exp>summary::before{content:"▸";font-size:11px}
  details.exp[open]>summary::before{content:"▾"}
  details.exp>.exp-body{margin-top:8px}
  @media(max-width:640px){
    table.rt thead{display:none}
    table.rt, table.rt tbody, table.rt tr, table.rt td{display:block;width:100%}
    table.rt tr{border:1px solid var(--linha);border-radius:10px;margin-bottom:10px;padding:8px 12px;background:#fff}
    table.rt td{border:none;padding:5px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13.5px}
    table.rt td::before{content:attr(data-label);color:var(--txt2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
    table.rt td[data-label=""]::before,table.rt td:not([data-label])::before{content:""}
  }
</style>
</head>
<body>
<header class="top">
  <span class="crown">👑</span>
  <h1>Fazenda Realeza<small>Painel Gerencial</small></h1>
  <span class="badge">v0.3</span>
  <div class="topright" id="topright"></div>
</header>

<div id="login" style="display:none">
  <form class="loginbox" onsubmit="fazerLogin(event)">
    <div class="cr">👑</div>
    <h2>Painel Gerencial</h2>
    <p class="sub">Entre com sua conta para ver os dados da fazenda e as notas fiscais.</p>
    <div class="loginerr" id="loginerr"></div>
    <div class="field"><label>E-mail</label><input id="li_email" type="email" autocomplete="username" placeholder="voce@email.com" required></div>
    <div class="field"><label>Senha</label><input id="li_senha" type="password" autocomplete="current-password" placeholder="sua senha" required></div>
    <button class="btn" type="submit" id="li_btn">Entrar</button>
  </form>
</div>

<div id="estado" style="display:none"><span class="spin"></span> Carregando dados da fazenda…</div>
<div class="shell" id="shell" style="display:none">
  <nav class="side" id="side"></nav>
  <main class="main" id="conteudo"></main>
</div>

<script>
// ============================================================
// PAINEL GERENCIAL — arquivo independente do app de campo.
// Lê o MESMO banco (Supabase). Rebanho e Relatórios leem dados
// reais. Os módulos "a ativar" (Financeiro, Vendas, Compras,
// Maquinários, Contabilidade) mostram o layout pronto — vão
// guardar dados quando ligarmos as tabelas + login.
// Nada aqui altera dados nem toca no app de campo (index.html).
// ============================================================
const SB_URL="https://kjjyscczxsymgdvbfiji.supabase.co";
const SB_KEY="sb_publishable_h-_5949kSZp_8jHgsDnBtQ_0IIclnqn";
const APP_SLUG="fazenda-realeza";
const TABELAS=["animais","operacoes_rebanho","reproducao","reproducao_touros","equipes","lotes","pastos","gestao_lancamentos"];
const L={};

// ---------- Sessão / login (Supabase Auth via REST) ----------
let SESSION=null; const AUTH_KEY="fr_ger_sess";
function saveSession(s){ SESSION=s; try{ localStorage.setItem(AUTH_KEY, JSON.stringify(s)); }catch(e){} }
function loadSession(){ try{ const s=JSON.parse(localStorage.getItem(AUTH_KEY)||"null"); if(s&&s.access_token) SESSION=s; }catch(e){} }
function clearSession(){ SESSION=null; try{ localStorage.removeItem(AUTH_KEY); }catch(e){} }
function authPost(grant, body){
  return new Promise((resolve,reject)=>{
    const x=new XMLHttpRequest();
    x.open("POST", SB_URL+"/auth/v1/token?grant_type="+grant, true);
    x.setRequestHeader("apikey",SB_KEY); x.setRequestHeader("Content-Type","application/json");
    x.timeout=20000;
    x.onload=()=>{ let d={}; try{ d=JSON.parse(x.responseText||"{}"); }catch(e){}
      if(x.status>=200&&x.status<300&&d.access_token) resolve(d);
      else reject(new Error(d.error_description||d.msg||d.error||"E-mail ou senha inválidos")); };
    x.onerror=()=>reject(new Error("sem internet"));
    x.ontimeout=()=>reject(new Error("tempo esgotado — sinal fraco"));
    x.send(JSON.stringify(body));
  });
}
async function entrar(email, senha){
  const d=await authPost("password",{email:email,password:senha});
  saveSession({access_token:d.access_token, refresh_token:d.refresh_token, expira:Date.now()+((d.expires_in||3600)*1000), email:(d.user&&d.user.email)||email});
}
async function garantirToken(){
  if(!SESSION) throw new Error("sem_sessao");
  if(Date.now() < SESSION.expira-60000) return SESSION.access_token;
  const d=await authPost("refresh_token",{refresh_token:SESSION.refresh_token});
  saveSession({access_token:d.access_token, refresh_token:d.refresh_token||SESSION.refresh_token, expira:Date.now()+((d.expires_in||3600)*1000), email:SESSION.email});
  return SESSION.access_token;
}
function sair(){ clearSession(); location.hash=""; mostrarLogin(); }

// ---------- leitura (anon p/ tabelas abertas; token p/ fiscal) ----------
async function req(path, comToken){
  let auth="Bearer "+SB_KEY;
  if(comToken) auth="Bearer "+(await garantirToken());
  return new Promise((resolve,reject)=>{
    const x=new XMLHttpRequest();
    x.open("GET", SB_URL+path, true);
    x.setRequestHeader("apikey",SB_KEY); x.setRequestHeader("Authorization",auth);
    x.timeout=20000;
    x.onload=()=>{ if(x.status===401) return reject(new Error("nao_autorizado"));
      try{ resolve(JSON.parse(x.responseText||"[]")); }catch(e){ reject(e); } };
    x.onerror=()=>reject(new Error("sem internet ou sinal fraco"));
    x.ontimeout=()=>reject(new Error("tempo esgotado — sinal fraco"));
    x.send();
  });
}
async function reqWrite(method, path, body, prefer){
  const token=await garantirToken();   // escrita como usuário autenticado (necessário p/ tabelas do Sintegra)
  return new Promise((resolve,reject)=>{
    const x=new XMLHttpRequest();
    x.open(method, SB_URL+path, true);
    x.setRequestHeader("apikey",SB_KEY); x.setRequestHeader("Authorization","Bearer "+(token||SB_KEY));
    x.setRequestHeader("Content-Type","application/json"); x.setRequestHeader("Prefer",prefer||"return=minimal");
    x.timeout=20000;
    x.onload=()=>{ if(x.status>=200&&x.status<300) resolve(true); else reject(new Error("HTTP "+x.status+" "+(x.responseText||""))); };
    x.onerror=()=>reject(new Error("sem internet ou sinal fraco"));
    x.ontimeout=()=>reject(new Error("tempo esgotado"));
    x.send(JSON.stringify(body));
  });
}
async function lerTabela(t){
  let all=[], from=0; const page=1000;
  while(true){
    const rows=await req(`/rest/v1/${t}?select=id,doc&offset=${from}&limit=${page}`);
    all=all.concat(rows);
    if(rows.length<page) break;
    from+=page;
  }
  return all.map(r=>Object.assign({},r.doc,{id:r.id}));
}
async function lerTitulos(){
  const cols="app_slug,id,nota_chave,tipo_titulo,tipo_doc,numero,serie,data_emissao,vencimento,valor,contraparte_nome,contraparte_doc,contraparte_ie,cfop,natureza,descricao,status,pago,data_pagamento,valor_pago,conta_ref,forma_pagamento,extrato_id";
  return await req(`/rest/v1/gestao_titulos_por_app?app_slug=eq.${APP_SLUG}&select=${cols}&order=data_emissao.desc&limit=5000`, true);
}
async function lerPlanos(){
  try{ return await req(`/rest/v1/fiscal_plano_contas?select=codigo,reduzido,descricao,tipo&order=codigo&limit=3000`); }
  catch(e){ return []; }
}
let PRODUTOR_ID=null;
async function lerProdutorId(){
  if(PRODUTOR_ID) return PRODUTOR_ID;
  try{ const r=await req(`/rest/v1/gestao_app_produtores?app_slug=eq.${APP_SLUG}&select=produtor_id`, true); PRODUTOR_ID=(r&&r[0])?r[0].produtor_id:null; return PRODUTOR_ID; }catch(e){ return null; }
}
async function lerPropriedades(){
  try{ const pid=await lerProdutorId();
    const url = pid? `/rest/v1/fiscal_propriedades?produtor_id=eq.${pid}&select=id,nome,municipio,uf&order=nome` : `/rest/v1/fiscal_propriedades?select=id,nome,municipio,uf&order=nome`;
    return await req(url); }catch(e){ return []; }
}
async function lerContas(){
  try{ const pid=await lerProdutorId();
    const url = pid? `/rest/v1/fiscal_contas_bancarias?produtor_id=eq.${pid}&select=id,banco,agencia,conta,tipo,titular,pix&order=banco` : `/rest/v1/fiscal_contas_bancarias?select=id,banco,agencia,conta,tipo,titular,pix&order=banco`;
    return await req(url, true); }catch(e){ return []; }
}
async function lerExtratos(){
  try{ const pid=await lerProdutorId(); if(!pid) return [];
    return await req(`/rest/v1/gestao_extratos?produtor_id=eq.${pid}&select=id,origem,conta_ref,data,descricao,documento,valor,tipo,conciliado,titulo_id,hash&order=data.desc&limit=3000`, true);
  }catch(e){ return []; }
}

function mostrarLogin(msg){
  document.getElementById("shell").style.display="none";
  document.getElementById("estado").style.display="none";
  document.getElementById("topright").innerHTML="";
  const lg=document.getElementById("login"); lg.style.display="flex";
  const e=document.getElementById("loginerr");
  if(msg){ e.textContent=msg; e.style.display="block"; } else e.style.display="none";
  const b=document.getElementById("li_btn"); if(b){ b.disabled=false; b.textContent="Entrar"; }
}
async function fazerLogin(ev){
  ev.preventDefault();
  const email=document.getElementById("li_email").value.trim();
  const senha=document.getElementById("li_senha").value;
  const b=document.getElementById("li_btn"); b.disabled=true; b.textContent="Entrando…";
  document.getElementById("loginerr").style.display="none";
  try{ await entrar(email,senha); document.getElementById("login").style.display="none"; carregar(); }
  catch(e){ mostrarLogin(e.message||"Não foi possível entrar."); }
}

// ---- helpers (iguais aos do app de campo, já testados) ----
const esc=s=>(s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate=d=>{ if(!d) return "—"; const p=String(d).split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; };
const fmtBRL=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function idadeMeses(d){ if(!d) return null; const n=new Date(), b=new Date(d); return (n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth()); }
function idadeTxt(d){ const m=idadeMeses(d); if(m===null) return "—"; const a=Math.floor(m/12), r=m%12; return a>0?`${a}a ${r}m`:`${m}m`; }
function categoriaAnimal(a){
  if(!a || a.tipo==="touro") return "";
  const m=idadeMeses(a.data_nascimento);
  if(m==null) return "sem data";
  if(a.tipo==="femea") return m<=12?"bezerra": m<=24?"novilha":"vaca";
  return m<=12?"bezerro": m<=20?"garrote":"boi";
}
function coberturaTxt(c){
  if(c.tipo==="iatf") return c.touro_nome? ("IATF · "+esc(c.touro_nome)) : "IATF";
  if(c.tipo==="touro") return c.equipe_nome? ("Equipe "+esc(c.equipe_nome)) : "Touro";
  return "—";
}
function diasGestacaoPos(tipo){ return tipo==="iatf" ? 225 : 220; }
function calcPrevisaoParto(r){
  if(r && r.resultado_prenhez!==true && r.fase!=="prenhe") return null;
  const base = r && r.data_diagnostico;
  if(!base) return (r&&r.data_prevista_parto)||null;
  const d=new Date(base+"T00:00:00"); d.setDate(d.getDate()+diasGestacaoPos(r.tipo));
  return d.toISOString().slice(0,10);
}
function intervaloVazias6m(ciclos){
  const vz=(ciclos||[]).filter(c=>c.resultado_prenhez===false)
    .map(c=>c.data_diagnostico||c.data_cobertura||((c.created_at||"").slice(0,10)))
    .filter(Boolean).sort();
  for(let i=0;i<vz.length;i++) for(let j=i+1;j<vz.length;j++){
    const meses=(new Date(vz[j])-new Date(vz[i]))/(1000*60*60*24*30.44);
    if(meses<=6) return {ok:true};
  }
  return {ok:false};
}

function contaNoRebanho(a){ return !a.arquivado && !(a.tipo==="touro" && a.procedencia==="central"); }
function faixaDe(m){ if(m==null) return "sem_data"; if(m<=12) return "0-12"; if(m<=24) return "13-24"; return "25+"; }
function femeaRepro(f){
  const ciclos=(L.reproducao||[]).filter(r=>r.animal_id===f.id).sort((a,b)=>b.ciclo-a.ciclo);
  const ultimo=ciclos[0]||null; let situacao="sem_registro";
  if(ultimo){ if(ultimo.fase==="prenhe") situacao="prenhe"; else if(ultimo.fase==="vazia") situacao="vazia"; else if(ultimo.fase==="parida") situacao="parida"; else situacao="em_processo"; }
  return { animal_id:f.id, numero:f.numero, total_ciclos:ciclos.length, ciclos_confirmados:ciclos.filter(r=>r.resultado_prenhez!=null).length, situacao, ultimo_resultado: ultimo?(ultimo.resultado_prenhez??null):null, ultima_fase: ultimo?ultimo.fase:null };
}
function relViewRows(name){
  const ativos=(L.animais||[]).filter(contaNoRebanho);
  if(name==="vw_contagem_tipo"){ const g={}; ativos.forEach(a=>g[a.tipo]=(g[a.tipo]||0)+1); return Object.keys(g).map(t=>({tipo:t,total:g[t]})); }
  if(name==="vw_faixa_etaria"){ const g={}; ativos.forEach(a=>{const k=a.tipo+"|"+faixaDe(idadeMeses(a.data_nascimento)); g[k]=(g[k]||0)+1;}); return Object.keys(g).map(k=>({tipo:k.split("|")[0],faixa:k.split("|")[1],total:g[k]})); }
  if(name==="vw_resumo_reproducao"){ const fs=ativos.filter(a=>a.tipo==="femea").map(femeaRepro);
    return { total_femeas:fs.length, prenhes:fs.filter(f=>f.situacao==="prenhe").length, vazias:fs.filter(f=>f.situacao==="vazia").length, paridas:fs.filter(f=>f.situacao==="parida").length, em_processo:fs.filter(f=>f.situacao==="em_processo").length, sem_registro:fs.filter(f=>f.situacao==="sem_registro").length, com_2_ou_mais_ciclos:fs.filter(f=>f.total_ciclos>=2).length }; }
  return [];
}
function vaziasJanela6m(animalId){
  const vz=(L.reproducao||[]).filter(r=>r.animal_id===animalId && r.resultado_prenhez===false)
    .map(r=>r.data_diagnostico||r.data_cobertura||((r.created_at||"").slice(0,10))).filter(Boolean).sort();
  for(let i=0;i<vz.length;i++){ let n=1, ate=vz[i];
    for(let j=i+1;j<vz.length;j++){ const meses=(new Date(vz[j])-new Date(vz[i]))/(1000*60*60*24*30.44); if(meses<=6){ n++; ate=vz[j]; } else break; }
    if(n>=3) return {alerta:true, n, de:vz[i], ate}; }
  return {alerta:false, n:0};
}

function dadosRebanho(){
  const A=L.animais.filter(a=>!a.arquivado);
  const femeas=A.filter(a=>a.tipo==="femea");
  const machos=A.filter(a=>a.tipo==="macho");
  const touros=A.filter(a=>a.tipo==="touro" && a.procedencia!=="central");
  const ultimoRepro=fid=>{ const cs=L.reproducao.filter(r=>r.animal_id===fid).sort((a,b)=>(b.ciclo||0)-(a.ciclo||0)); return cs[0]||null; };
  let prenhes=0,vazias=0,proc=0; const prenhasRecs=[];
  femeas.forEach(f=>{ const u=ultimoRepro(f.id); if(!u) return;
    if(u.fase==="prenhe"||u.resultado_prenhez===true){ prenhes++; prenhasRecs.push({f,r:u}); }
    else if(u.fase==="vazia"||u.resultado_prenhez===false) vazias++; else proc++; });
  const expostas=prenhes+vazias+proc, taxa=expostas?Math.round(prenhes/expostas*100):0;
  const hoje=Date.now(); const partos=[];
  prenhasRecs.forEach(x=>{ const dp=calcPrevisaoParto(x.r); if(dp) partos.push({f:x.f,dp,cob:coberturaTxt(x.r),tipo:x.r.tipo}); });
  partos.sort((a,b)=>a.dp<b.dp?-1:1);
  const prox60=partos.filter(p=>{ const d=(new Date(p.dp)-hoje)/86400000; return d>=0&&d<=60; }).length;
  const descarte=[];
  femeas.forEach(f=>{ const cs=L.reproducao.filter(r=>r.animal_id===f.id); const u=ultimoRepro(f.id);
    const vazia=u&&(u.fase==="vazia"||u.resultado_prenhez===false); const rep=intervaloVazias6m(cs).ok;
    if(vazia||rep) descarte.push({f, motivo:rep?"Vazia repetida":"Vazia"}); });
  descarte.sort((a,b)=>(a.f.numero||0)-(b.f.numero||0));
  const porMes={};
  L.operacoes_rebanho.forEach(o=>{ if(o.peso&&o.data){ const mk=String(o.data).slice(0,7); (porMes[mk]=porMes[mk]||[]).push(parseFloat(o.peso)); } });
  const mesesPeso=Object.entries(porMes).sort((a,b)=>a[0]<b[0]?-1:1).slice(-12).map(([mk,v])=>({mk,media:Math.round(v.reduce((s,x)=>s+x,0)/v.length),n:v.length}));
  const ppm={}; partos.forEach(p=>{ const mk=p.dp.slice(0,7); ppm[mk]=ppm[mk]||{iatf:0,monta:0}; if(p.tipo==="iatf") ppm[mk].iatf++; else ppm[mk].monta++; });
  const mesesParto=Object.entries(ppm).sort((a,b)=>a[0]<b[0]?-1:1).slice(0,12);
  return {A,femeas,machos,touros,prenhes,expostas,taxa,partos,prox60,descarte,mesesPeso,mesesParto};
}

  const totalFemeasReb = femeasAtivas.length;
  const statusReprodF = (f)=>{ const cs=L.reproducao.filter(r=>r.animal_id===f.id).sort((a,b)=>(b.ciclo||0)-(a.ciclo||0)); if(!cs.length) return "sem"; const u=cs[0]; if(u.fase==="prenhe"||u.resultado_prenhez===true) return "prenhe"; if(u.fase==="vazia"||u.resultado_prenhez===false) return "vazia"; if(u.fase==="aguardando") return "aguardando"; if(u.fase==="parida") return "parida"; return "sem"; };
  const temRepro=(fid)=>L.reproducao.some(r=>r.animal_id===fid);

  // ---- Etapa 1: índices reprodutivos práticos ----
  const ultimoRepro=(fid)=>{ const cs=L.reproducao.filter(r=>r.animal_id===fid).sort((a,b)=>(b.ciclo||0)-(a.ciclo||0)); return cs[0]||null; };
  // 1) Taxa de prenhez sobre expostas
  const expostas=(rp.prenhes||0)+(rp.vazias||0)+(rp.em_processo||0);
  const taxaPrenhez=expostas?Math.round(rp.prenhes/expostas*100):0;

  const totPrenhas=prenhasRecs.length;
  // 2) por método
  let mIatf=0,mTouro=0; prenhasRecs.forEach(x=>{ if(x.r.tipo==="iatf") mIatf++; else mTouro++; });
  const pIatf=totPrenhas?Math.round(mIatf/totPrenhas*100):0; const pTouro=totPrenhas?100-pIatf:0;
  // monta natural detalhada por equipe de touro
  const porEquipe={}; prenhasRecs.forEach(x=>{ if(x.r.tipo==="touro"){ const nome=x.r.equipe_nome||"Sem equipe"; porEquipe[nome]=(porEquipe[nome]||0)+1; } });
  const equipeRows=Object.entries(porEquipe).sort((a,b)=>b[1]-a[1]);
  // IATF detalhada por touro (sêmen)
  const porTouroIatf={}; prenhasRecs.forEach(x=>{ if(x.r.tipo==="iatf"){ const nome=x.r.touro_nome||"Sem touro"; porTouroIatf[nome]=(porTouroIatf[nome]||0)+1; } });
  const touroRows=Object.entries(porTouroIatf).sort((a,b)=>b[1]-a[1]);
  // 3) por categoria
  const catRep={bezerra:{exp:0,pren:0},novilha:{exp:0,pren:0},vaca:{exp:0,pren:0}};
  femeasAtivas.forEach(f=>{ const c=categoriaAnimal(f); if(!catRep[c]) return; const u=ultimoRepro(f.id); if(u){ catRep[c].exp++; if(u.fase==="prenhe"||u.resultado_prenhez===true) catRep[c].pren++; } });
  // 4) distribuição na estação (data da monta; diagnóstico quando ausente)
  const tercos=[0,0,0]; let semDataMonta=0, estIni=null, estFim=null;

  const refs=prenhasRecs.map(x=>{ const d=x.r.data_cobertura; return d?new Date(d).getTime():null; });

  const datasDistintas=new Set(refsOk).size;
  let estacaoValida=false;
  if(refsOk.length){ const min=Math.min(...refsOk), max=Math.max(...refsOk); estIni=min; estFim=max; const span=max-min;
    // só há "estação" para dividir se houver dispersão real de datas (>= 2 datas e span >= 14 dias)
    estacaoValida = datasDistintas>=2 && span>=14*86400000;
    if(estacaoValida) refsOk.forEach(t=>{ let idx=Math.min(2,Math.floor((t-min)/span*3)); tercos[idx]++; }); }
  // composição real do plantel prenhe por método

  ciclosNums.forEach(a=>a.sort((p,q)=>p-q));
  const totCiclos=ciclos[0]+ciclos[1]+ciclos[2];

  const dISO=(ms)=> new Date(ms).toISOString().slice(0,10);
  // 5) lista de descarte consolidada — regra: 3 ou mais vazias em até 6 meses

    if(jv.alerta) descarte.push({f, motivo:`Vazia ${jv.n}× (≤6 meses)`, cat:categoriaAnimal(f), idade:idadeTxt(f.data_nascimento), data: u?(u.data_diagnostico||u.data_cobertura):null}); });
  descarte.sort((a,b)=>(a.f.numero||0)-(b.f.numero||0));

  // Previsão de partos

  const mesNome=mk=>{ const p=mk.split('-'); return MESES[parseInt(p[1],10)-1]+'/'+p[0]; };

    const dp=calcPrevisaoParto(u);

  const totIatfParto=partos.filter(p=>p.tipo==="iatf").length, totMontaParto=partos.length-totIatfParto;
  const prox60=partos.filter(p=>{ const dias=(new Date(p.dp)-hojeMs)/86400000; return dias>=0 && dias<=60; }).length;

  // Taxa de concepção por touro/sêmen e por data de diagnóstico
  const touroLabel = r => r.tipo==="iatf" ? (r.touro_nome||"IATF (sem sêmen)") : (r.equipe_nome? ("Equipe "+r.equipe_nome) : (r.touro_nome||"Touro"));

  const concDT={};
  diagRecs.forEach(r=>{ const dt=r.data_diagnostico||"—"; const k=dt+"|"+touroLabel(r)+"|"+r.tipo; if(!concDT[k]) concDT[k]={data:dt, nome:touroLabel(r), metodo:r.tipo, pren:0, vaz:0}; if(r.resultado_prenhez) concDT[k].pren++; else concDT[k].vaz++; });

async function itensDaTabela(chave){

  return (rows||[]).map(r=>({ item:r.item, codigo:r.codigo, descricao:r.descricao, ncm:r.ncm, cfop:r.cfop, unidade:r.unidade, quantidade:r.quantidade, valor_unit:r.valor_unit, valor_total:r.valor_total }));

async function fetchXmlTxt(path){
  const token=await garantirToken();
  const url=SB_URL+"/storage/v1/object/xmls-fiscais/"+encodeURI(path);
  return await new Promise((resolve,reject)=>{
    const x=new XMLHttpRequest();
    x.open("GET",url,true); x.setRequestHeader("apikey",SB_KEY); x.setRequestHeader("Authorization","Bearer "+token); x.timeout=20000;
    x.onload=()=>{ if(x.status>=200&&x.status<300) resolve(x.responseText); else reject(new Error("HTTP "+x.status)); };
    x.onerror=()=>reject(new Error("rede")); x.ontimeout=()=>reject(new Error("timeout")); x.send();
  });
}
async function parseXMLDados(path){
  if(finXmlCache[path]) return finXmlCache[path];
  const txt=await fetchXmlTxt(path);
  const docx=new DOMParser().parseFromString(txt,"application/xml");
  const get=(el,tag)=>{ if(!el) return ""; const n=el.getElementsByTagName(tag); return n.length?(n[0].textContent||"").trim():""; };
  const items=Array.from(docx.getElementsByTagName("det")).map((d,i)=>{ const prod=d.getElementsByTagName("prod")[0]; if(!prod) return null;
    return { item:d.getAttribute("nItem")||String(i+1), codigo:get(prod,"cProd"), descricao:get(prod,"xProd"), ncm:get(prod,"NCM"), cfop:get(prod,"CFOP"), unidade:get(prod,"uCom"), quantidade:get(prod,"qCom"), valor_unit:parseFloat(get(prod,"vUnCom")||"0")||0, valor_total:parseFloat(get(prod,"vProd")||"0")||0 }; }).filter(Boolean);
  const parcelas=Array.from(docx.getElementsByTagName("dup")).map(d=>({ n:get(d,"nDup"), venc:get(d,"dVenc"), valor:parseFloat(get(d,"vDup")||"0")||0 })).filter(p=>p.venc||p.valor);
  const dp=docx.getElementsByTagName("detPag")[0];
  const tPag=dp?get(dp,"tPag"):"";
  const mapForma={'01':'Dinheiro','02':'Cheque','03':'Cartão','04':'Cartão','05':'Cartão','10':'Cartão','11':'Cartão','15':'Boleto','17':'PIX','18':'Transferência','19':'Transferência'};
  const forma=mapForma[tPag]||null;
  const res={items,parcelas,forma}; finXmlCache[path]=res; return res;
}
async function carregarItens(chave){
  if(!chave) return [];
  if(finItensCache[chave]) return finItensCache[chave];
  let items=await itensDaTabela(chave);
  if(!items.length){
    const n=await carregarNota(chave);
    if(n && n.xml_storage_path && n.xml_completo){ try{ items=(await parseXMLDados(n.xml_storage_path)).items; }catch(e){ items=[]; } }
  }
  finItensCache[chave]=items; return items;
}
async function carregarPagamento(chave){
  if(finPagto[chave]) return finPagto[chave];
  let res={parcelas:[],forma:null};
  const n=await carregarNota(chave);
  if(n && n.xml_storage_path && n.xml_completo){ try{ const x=await parseXMLDados(n.xml_storage_path); res={parcelas:x.parcelas||[], forma:x.forma||null}; }catch(e){} }
  finPagto[chave]=res; return res;
}
async function mapLimit(arr, limit, fn, onProgress){
  const out=[]; let idx=0, done=0;
  async function worker(){ while(idx<arr.length){ const i=idx++; try{ out[i]=await fn(arr[i], i); }catch(e){ out[i]=null; } done++; if(onProgress) onProgress(done, arr.length); } }
  const ws=[]; for(let k=0;k<Math.min(limit,arr.length);k++) ws.push(worker());
  await Promise.all(ws); return out;
}
async function docAutomatico(t){

  return { origem:'sintegra', titulo_id:t.id, nota_chave:t.nota_chave, tipo_titulo:t.tipo_titulo, contraparte_nome:t.contraparte_nome, valor:Number(t.valor||0), data_emissao:emiss,

    pago:pago, data_pagamento:pago?emiss:null, atualizado_em:new Date().toISOString(), auto:true };
}

  if(!pend.length){ alert('Não há títulos pendentes para lançar.'); return; }
  if(!confirm(`Lançar automaticamente ${pend.length} título(s) pendentes?\n\n• Vencimento e forma de pagamento vêm da nota.\n• Compras à vista pagas no ato entram como PAGAS.\n• O plano de contas fica em branco para você preencher depois.\n\nVocê pode desfazer depois no botão "Desfazer automáticos".`)) return;

  try{ const notas=await req(`/rest/v1/fiscal_notas?select=chave,xml_storage_path,xml_completo,data_emissao,operacao&limit=5000`, true); (notas||[]).forEach(n=>{ if(n.chave) finNotaCache[n.chave]=n; }); }catch(e){}
  const docs=(await mapLimit(pend, 6, docAutomatico, (d)=>{ const e=document.getElementById('lt-prog'); if(e) e.textContent=d; })).filter(Boolean);
  let gravados=0;

  const tipo=finTipo;

    if(t.pago){ lanc=Object.assign({}, lanc||{}, {pago:true, vencimento:(lanc&&lanc.vencimento)||t.vencimento, conta_nome:(lanc&&lanc.conta_nome)||t.conta_ref, data_pagamento:(lanc&&lanc.data_pagamento)||t.data_pagamento}); }

function toggleRateio(){ const s=document.getElementById('lc_rateio'); if(!s) return; const v=s.value; const a=document.getElementById('rateio-total'), b=document.getElementById('rateio-produto'); if(a)a.style.display=v==='produto'?'none':'block'; if(b)b.style.display=v==='produto'?'block':'none'; }
async function salvarLancamento(tituloId){
  const t=titulosFiscais().find(x=>x.id===tituloId); if(!t) return;
  const val=id=>{const e=document.getElementById(id);return e?e.value:'';};
  const rateioTipo=val('lc_rateio')||'total';
  let rateio=[], plano={codigo:null,descricao:null};
  if(rateioTipo==='produto'){
    const items=finItensCache[t.nota_chave]||[];
    rateio=items.map((it,i)=>{ const pp=parsePlano(val('lc_plano_'+i)); return {descricao:it.descricao, valor:Number(it.valor_total||0), plano_codigo:pp.codigo, plano_descricao:pp.descricao}; });
  } else { plano=parsePlano(val('lc_plano')); }
  const pago=document.getElementById('lc_pago')&&document.getElementById('lc_pago').checked;
  const propId=val('lc_prop')||null;
  const contaId=val('lc_conta')||null;
  const doc={ origem:'sintegra', titulo_id:t.id, nota_chave:t.nota_chave, tipo_titulo:t.tipo_titulo, contraparte_nome:t.contraparte_nome, valor:Number(t.valor||0), data_emissao:t.data_emissao?String(t.data_emissao).slice(0,10):null,
    vencimento:val('lc_venc')||null, parcelas:((finPagto[t.nota_chave]||{}).parcelas||[]), forma_pagamento:val('lc_forma')||null, propriedade_id:propId, propriedade_nome:propNome(propId), conta_id:contaId, conta_nome:contaNome(contaId), rateio_tipo:rateioTipo, rateio, plano_codigo:plano.codigo, plano_descricao:plano.descricao,
    pago:!!pago, data_pagamento:pago?(val('lc_dpag')||null):null, atualizado_em:new Date().toISOString() };
  const ex=lancDeTitulo(t.id);
  const venc=val('lc_venc')||null;
  const contaRef=contaNome(contaId);
  try{
    if(ex) await reqWrite('PATCH', `/rest/v1/gestao_lancamentos?id=eq.${ex.id}`, {doc});
    else await reqWrite('POST', `/rest/v1/gestao_lancamentos`, {doc});
    // baixa/conciliação volta pro SINTEGRA (gestao_titulos) → forma o livro caixa
    try{
      const patch={
        status: pago?'pago':'lancado', lancado_em:new Date().toISOString(),
        pago:!!pago, data_pagamento: pago?(val('lc_dpag')||null):null, valor_pago: pago?Number(t.valor||0):null,
        conta_ref: contaRef, forma_pagamento: val('lc_forma')||null, vencimento: venc
      };
      // se desmarcou "pago" num título que estava conciliado, desfaz também a conciliação do extrato
      if(!pago && t.extrato_id){ patch.extrato_id=null;
        try{ await reqWrite('PATCH', `/rest/v1/gestao_extratos?id=eq.${t.extrato_id}`, {conciliado:false, titulo_id:null}); }catch(_){}
      }
      await reqWrite('PATCH', `/rest/v1/gestao_titulos?id=eq.${t.id}`, patch);
      await recarregarTitulos(); L.extratos=await lerExtratos();
    }catch(e2){ console.warn('baixa gestao_titulos falhou', e2); alert('Lançamento salvo no app, mas a baixa não voltou pro SINTEGRA: '+(e2.message||e2)); }
    await recarregarLancamentos(); finMode='lista'; render();
  }catch(e){ alert('Erro ao salvar: '+(e.message||e)); }
}

// pago = baixa dada no título do SINTEGRA OU no lançamento avulso do app
function tituloPago(t){ if(t&&t.pago) return true; const l=lancDeTitulo(t.id); return !!(l&&l.pago); }
function linhasLivroCaixa(){
  const out=[];
  // títulos fiscais (baixa gravada no gestao_titulos → volta pro SINTEGRA)
  titulosFiscais().forEach(t=>{ const l=lancDeTitulo(t.id)||{};
    const pago = t.pago || l.pago;
    const dp = t.data_pagamento || l.data_pagamento;
    if(!pago || !dp) return;
    out.push({ data:String(dp).slice(0,10), tipo:t.tipo_titulo, contraparte:t.contraparte_nome, doc:(t.tipo_doc||'')+(t.numero?(' '+t.numero):''),
      hist:t.natureza||t.descricao||'', conta:t.conta_ref||l.conta_nome||'', plano:planoTxt(l),
      valor:Number(t.valor_pago!=null?t.valor_pago:(l.valor!=null?l.valor:t.valor))||0, forma:t.forma_pagamento||l.forma_pagamento||'' });
  });
  // avulsos pagos (só no app; entram no livro caixa gerado aqui)
  avulsos().forEach(a=>{ if(!a.pago || !a.data_pagamento) return;
    out.push({ data:String(a.data_pagamento).slice(0,10), tipo:a.tipo_titulo, contraparte:a.contraparte_nome, doc:(a.descricao||'avulso'),
      hist:a.descricao||'', conta:a.conta_nome||'', plano:planoTxt(a), valor:Number(a.valor)||0, forma:a.forma_pagamento||'' });
  });
  out.sort((x,y)=> x.data<y.data?-1:x.data>y.data?1:0);
  return out;
}

function exportarLivroCaixa(){

  const esc2=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const rows=linhas.map(l=>{ const ent=l.tipo==='receber'?l.valor:0, sai=l.tipo==='pagar'?l.valor:0; saldo+=ent-sai;
    return [l.data,l.conta,l.contraparte,l.doc,l.hist,l.plano,ent?ent.toFixed(2).replace('.',','):'',sai?sai.toFixed(2).replace('.',','):'',saldo.toFixed(2).replace('.',',')].map(esc2).join(';'); });
  const csv='﻿'+[head.map(esc2).join(';')].concat(rows).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob);

}

/* ===================== CONCILIAÇÃO BANCÁRIA (extrato) ===================== */
function parseNumBR(s){ if(s==null) return null; let x=String(s).replace(/\s|R\$/gi,''); if(!/[0-9]/.test(x)) return null;
  if(x.indexOf(',')>=0){ x=x.replace(/\./g,'').replace(',', '.'); } // 1.234,56 -> 1234.56
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(x)){ x=x.replace(/\./g,''); } // 1.234 / 1.234.567 (milhar sem centavos)
  const n=parseFloat(x); return isNaN(n)?null:n; }
function parseDataBR(s){ if(!s) return null; s=String(s).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if(m){ let a=m[3]; if(a.length===2) a='20'+a; return `${a}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  m=s.match(/^(\d{8})$/); if(m) return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`;
  return null; }
function parseExtrato(txt){
  txt=(txt||'').trim(); if(!txt) return [];
  if(/<STMTTRN>|<OFX>/i.test(txt)){
    const out=[]; txt.split(/<STMTTRN>/i).slice(1).forEach(b=>{
      const g=tag=>{ const m=b.match(new RegExp('<'+tag+'>\\s*([^<\\r\\n]*)','i')); return m?m[1].trim():''; };
      const data=parseDataBR(g('DTPOSTED').slice(0,8)); const valor=parseNumBR(g('TRNAMT')); const memo=g('MEMO')||g('NAME')||''; const fit=g('FITID')||'';
      if(data && valor!=null) out.push({data, descricao:memo, documento:fit, valor});
    });
    return out;
  }
  // CSV simples: Data;Descrição;Valor  (valor negativo = saída)
  const out=[];
  txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    if(/^data\s*[;,]/i.test(l)) return; // cabeçalho
    const delim = l.indexOf(';')>=0?';':','; const p=l.split(delim);
    if(p.length<3) return;
    const data=parseDataBR(p[0]); const valor=parseNumBR(p[p.length-1]); const descricao=p.slice(1,p.length-1).join(' ').trim();
    if(data && valor!=null) out.push({data, descricao, documento:'', valor});
  });
  return out;
}
function hashExtrato(contaRef,e){ const uniq = e.documento? ('fit:'+e.documento) : ((e.descricao||'').slice(0,60)); return [contaRef,e.data,Number(e.valor).toFixed(2),uniq].join('|'); }
function titulosEmAberto(){ return titulosFiscais().filter(t=>!tituloPago(t)).sort((a,b)=>String(a.vencimento||a.data_emissao||'').localeCompare(String(b.vencimento||b.data_emissao||''))); }

function csvBaixar(nome, head, linhas){
  const esc2=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const csv='﻿'+[head.map(esc2).join(';')].concat(linhas.map(r=>r.map(esc2).join(';'))).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=nome; a.click(); setTimeout(()=>URL.revokeObjectURL(url),2000);
}

/* ===================== FLUXO DE CAIXA (projeção) ===================== */
function parseSaldoOFX(txt){ const m=(txt||'').match(/<LEDGERBAL>[\s\S]*?<BALAMT>\s*([-0-9.,]+)/i); if(!m) return null;
  const v=parseNumBR(m[1]); const dm=txt.match(/<LEDGERBAL>[\s\S]*?<DTASOF>\s*([0-9]{8})/i);
  return v==null?null:{saldo:v, data: dm?parseDataBR(dm[1]):null}; }
function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDiaCurto(iso){ const p=String(iso).split('-'); return p.length===3?(p[2]+'/'+p[1]):iso; }
function fluxoEventos(){
  const evs=[];
  const push=(d,val,tipo,nome)=>{ if(!d) return; evs.push({data:String(d).slice(0,10), val:Number(val||0), tipo, nome:nome||''}); };
  titulosEmAberto().forEach(t=> push(t.vencimento||t.data_emissao, t.valor, t.tipo_titulo, t.contraparte_nome));
  avulsos().filter(a=>!a.pago).forEach(a=> push(a.vencimento||a.data_emissao, a.valor, a.tipo_titulo, a.contraparte_nome||a.descricao));
  return evs;
}
function fluxoProjecao(dias, saldoIni){
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  const fim=new Date(hoje); fim.setDate(fim.getDate()+dias);
  const mapa={};
  fluxoEventos().forEach(e=>{ let dt=new Date(e.data+'T00:00:00'); if(isNaN(dt)) return; if(dt<hoje) dt=new Date(hoje); if(dt>fim) return;
    const iso=isoLocal(dt); if(!mapa[iso]) mapa[iso]={ent:0,sai:0,itens:[]}; if(e.tipo==='receber') mapa[iso].ent+=e.val; else mapa[iso].sai+=e.val; mapa[iso].itens.push(e); });
  const linhas=[]; let saldo=Number(saldoIni)||0;
  for(let i=0;i<=dias;i++){ const dt=new Date(hoje); dt.setDate(dt.getDate()+i); const iso=isoLocal(dt); const m=mapa[iso]||{ent:0,sai:0,itens:[]}; saldo+=m.ent-m.sai; linhas.push({iso, ent:m.ent, sai:m.sai, saldo, itens:m.itens}); }
  return linhas;
}
function desenharFluxo(elId, pts){
  const el=document.getElementById(elId); if(!el||!pts.length) return;
  const W=760,H=260,m={t:16,r:20,b:30,l:64};
  const ys=pts.map(p=>p.y); let ymin=Math.min(0,...ys), ymax=Math.max(0,...ys); if(ymin===ymax){ymin-=100;ymax+=100;}
  const pad=(ymax-ymin)*0.12||100; ymin-=pad; ymax+=pad;
  const X=i=> m.l+(pts.length<=1?0.5:i/(pts.length-1))*(W-m.l-m.r);
  const Y=v=> m.t+(1-(v-ymin)/(ymax-ymin))*(H-m.t-m.b);
  const fmtK=v=> Math.abs(v)>=1000?(Math.round(v/100)/10)+'k':Math.round(v).toString();
  const path=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const ticks=[...new Set([ymax,(ymax+ymin)/2,ymin,0])];
  const step=Math.ceil(pts.length/9);
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Fluxo de caixa projetado" style="width:100%;height:auto">
    ${ticks.map(t=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="${Math.abs(t)<0.01?'#b23b3b':'#e8ece6'}" ${Math.abs(t)<0.01?'stroke-dasharray="4 3"':''}/><text x="${m.l-6}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#5d6b62">${fmtK(t)}</text>`).join('')}
    <path d="${path}" fill="none" stroke="var(--serie1)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.2" fill="${p.y<0?'#b23b3b':'var(--serie1)'}"/>`).join('')}
    ${pts.map((p,i)=>(i%step===0||i===pts.length-1)?`<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#5d6b62">${p.x}</text>`:'').join('')}
  </svg>`;
}

/* ===================== CARTÃO DE CRÉDITO (fatura) ===================== */
function cartaoItens(incluirQuitados){
  const out=[];
  const add=(contraparte, doc, data, valor, l)=>{ out.push({contraparte, doc, data, valor:Number(valor||0), cartao:(l.conta_nome||'Cartão (sem conta)'), quitado:!!l.cartao_quitado, quitado_em:l.cartao_quitado_em||null, lancId:l.id}); };
  titulosFiscais().forEach(t=>{ const l=lancDeTitulo(t.id); if(l && l.forma_pagamento==='Cartão' && l.pago && (incluirQuitados||!l.cartao_quitado)) add(t.contraparte_nome,(t.tipo_doc||'')+(t.numero?' '+t.numero:''), l.data_pagamento||t.data_emissao, t.valor, l); });
  avulsos().forEach(a=>{ if(a.forma_pagamento==='Cartão' && a.pago && (incluirQuitados||!a.cartao_quitado)) add(a.contraparte_nome, a.descricao||'avulso', a.data_pagamento, a.valor, a); });
  return out;
}

  const nomes=Object.keys(grupos).sort();

   </div>`;

async function fecharFatura(cartao){
  const its=cartaoItens(false).filter(x=>x.cartao===cartao);
  if(!its.length) return;
  const tot=its.reduce((s,x)=>s+x.valor,0);
  if(!confirm(`Marcar a fatura do ${cartao} como PAGA?\nIsso fecha ${its.length} lançamento(s), total ${fmtBRL(tot)}. Depois é só conciliar o débito único da fatura no extrato.`)) return;
  const hoje=isoLocal(new Date());
  try{
    for(const x of its){ const l=(L.gestao_lancamentos||[]).find(g=>g.id===x.lancId); if(!l) continue; const {id, ...doc}=l; doc.cartao_quitado=true; doc.cartao_quitado_em=hoje; await reqWrite('PATCH', `/rest/v1/gestao_lancamentos?id=eq.${id}`, {doc}); }
    await recarregarLancamentos(); render();
    alert(`Fatura do ${cartao} fechada: ${its.length} lançamento(s), ${fmtBRL(tot)}.`);
  }catch(e){ alert('Erro ao fechar fatura: '+(e.message||e)); }
}
function exportarFaturaCartao(cartao){
  const its=cartaoItens(false).filter(x=>x.cartao===cartao).sort((a,b)=>String(a.data||'').localeCompare(String(b.data||'')));
  csvBaixar('fatura-'+cartao.replace(/[^\w]+/g,'-').toLowerCase()+'.csv', ['Data','Fornecedor','Documento','Valor'],
    its.map(x=>[x.data?String(x.data).slice(0,10):'', x.contraparte, x.doc, Number(x.valor).toFixed(2).replace('.',',')]));
}
function sugerirTitulo(e){
  const alvoTipo = e.valor<0?'pagar':'receber';
  const cands=titulosFiscais().filter(t=>t.tipo_titulo===alvoTipo && !tituloPago(t) && Math.abs(Number(t.valor||0)-Math.abs(e.valor))<0.02);
  if(!cands.length) return null;
  cands.sort((a,b)=>{ const da=Math.abs(new Date((a.vencimento||a.data_emissao||e.data))-new Date(e.data)); const db=Math.abs(new Date((b.vencimento||b.data_emissao||e.data))-new Date(e.data)); return da-db; });
  return cands[0];
}

function lerArquivoExtrato(input){
  const f=input&&input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ const ta=document.getElementById('cc_txt'); if(ta) ta.value=r.result;
    const prev=document.getElementById('cc_prev');
    const lidos=parseExtrato(r.result||'');
    if(prev) prev.innerHTML=`<div class="muted">Arquivo “${esc(f.name)}” carregado — ${lidos.length} movimento(s) reconhecido(s). Escolha a conta acima e clique em <b>“Pré-visualizar e importar”</b>.</div>`;
  };
  r.onerror=()=>{ alert('Não consegui ler o arquivo. Tente exportar em OFX ou CSV.'); };
  // OFX do Sicoob (Money) vem em latin1/windows-1252 → lê assim p/ não estragar acentos
  const nome=(f.name||'').toLowerCase();
  try{ r.readAsText(f, /\.(ofx|qfx)$/.test(nome)?'ISO-8859-1':'UTF-8'); }catch(_){ r.readAsText(f); }
}
async function importarExtrato(){
  const contaId=(document.getElementById('cc_conta')||{}).value||'';
  const contaRef=contaNome(contaId);
  if(!contaRef){ alert('Escolha a conta bancária do extrato.'); return; }
  const txt=(document.getElementById('cc_txt')||{}).value||'';
  const linhas=parseExtrato(txt);
  const prev=document.getElementById('cc_prev');
  if(!linhas.length){ if(prev) prev.innerHTML='<div class="muted">Não consegui ler nenhum movimento. Confira o formato (OFX ou CSV Data;Descrição;Valor).</div>'; return; }
  const existentes=new Set((L.extratos||[]).map(e=>e.hash).filter(Boolean));
  // dedup dentro do próprio arquivo (mesma impressão digital) + contra o que já existe
  const vistos=new Set(); const novos=[];
  linhas.forEach(e=>{ const h=hashExtrato(contaRef,e); if(existentes.has(h)||vistos.has(h)) return; vistos.add(h); novos.push({e,h}); });
  const jaExistiam=linhas.length-novos.length;
  if(prev) prev.innerHTML=`<div class="muted">Lidos ${linhas.length} movimento(s); ${novos.length} novo(s) para importar${jaExistiam?` (${jaExistiam} repetido(s)/já existente(s) ignorado(s))`:''}.</div>`;
  if(!novos.length){ alert('Todos os movimentos deste extrato já foram importados.'); return; }
  if(!confirm(`Importar ${novos.length} movimento(s) do extrato para a conta ${contaRef}?`)) return;
  const pid=await lerProdutorId();
  const antes=(L.extratos||[]).length;
  const body=novos.map(({e,h})=>({ produtor_id:pid, origem:'import', conta_ref:contaRef, data:e.data, descricao:e.descricao||null, documento:e.documento||null, valor:e.valor, tipo:e.valor<0?'debito':'credito', conciliado:false, hash:h }));
  try{
    // on_conflict=hash + ignore-duplicates → duplicado é ignorado no banco em vez de derrubar o lote
    for(let i=0;i<body.length;i+=100){ await reqWrite('POST', `/rest/v1/gestao_extratos?on_conflict=hash`, body.slice(i,i+100), 'resolution=ignore-duplicates,return=minimal'); }
    const sld=parseSaldoOFX(txt); if(sld){ window.__saldoBanco=window.__saldoBanco||{}; window.__saldoBanco[contaRef]={saldo:sld.saldo,data:sld.data}; }
    L.extratos=await lerExtratos(); render();
    const inseridos=(L.extratos||[]).length-antes;
    alert(`Extrato importado: ${inseridos} movimento(s) novo(s) na conta ${contaRef}.${jaExistiam?`\n(${jaExistiam} repetido(s) foram ignorados.)`:''}`);
  }catch(e){ alert('Erro ao importar extrato: '+(e.message||e)); }
}
async function conciliar(extId, titId){
  const e=(L.extratos||[]).find(x=>x.id===extId); const t=titulosFiscais().find(x=>x.id===titId);
  if(!e||!t) return;
  if(tituloPago(t)){ alert('Este título já está pago/conciliado.'); return; }
  try{
    await reqWrite('PATCH', `/rest/v1/gestao_extratos?id=eq.${extId}`, { conciliado:true, titulo_id:titId });
    await reqWrite('PATCH', `/rest/v1/gestao_titulos?id=eq.${titId}`, { pago:true, status:'pago', data_pagamento:e.data, valor_pago:Math.abs(Number(e.valor)), conta_ref:e.conta_ref, extrato_id:extId, lancado_em:new Date().toISOString() });
    await recarregarTitulos(); L.extratos=await lerExtratos(); render();
  }catch(err){ alert('Erro ao conciliar: '+(err.message||err)); }
}
async function desconciliar(extId, titId){
  if(!confirm('Desfazer a conciliação deste movimento? O título volta a ficar em aberto.')) return;
  try{
    await reqWrite('PATCH', `/rest/v1/gestao_extratos?id=eq.${extId}`, { conciliado:false, titulo_id:null });
    if(titId) await reqWrite('PATCH', `/rest/v1/gestao_titulos?id=eq.${titId}`, { pago:false, status:'lancado', data_pagamento:null, valor_pago:null, extrato_id:null });
    await recarregarTitulos(); L.extratos=await lerExtratos(); render();
  }catch(err){ alert('Erro: '+(err.message||err)); }
}
// candidatos a um movimento: mesmo sinal(tipo), não pago, valor exato, dentro da janela de dias
function candidatosTitulo(e, win, usados){
  const alvoTipo = Number(e.valor)<0?'pagar':'receber';
  const alvo=Math.abs(Number(e.valor));
  const ed=new Date(String(e.data).slice(0,10));
  return titulosFiscais().filter(t=>{
    if(t.tipo_titulo!==alvoTipo) return false;
    if(tituloPago(t)) return false;
    if(usados && usados.has(t.id)) return false;
    if(Math.abs(Number(t.valor||0)-alvo)>=0.02) return false;
    const ref=t.vencimento||t.data_emissao;
    if(win!=null && ref){ const dd=Math.abs((ed-new Date(String(ref).slice(0,10)))/86400000); if(dd>win) return false; }
    return true;
  });
}
async function conciliarAutomatico(){
  const winEl=document.getElementById('cc_janela'); const win=Math.max(0, parseInt(winEl&&winEl.value)||5);
  const pend=(L.extratos||[]).filter(e=>!e.conciliado);
  if(!pend.length){ alert('Não há movimentos pendentes para conciliar.'); return; }
  const usados=new Set(); const fila=[]; let ambiguos=0, semmatch=0;
  pend.forEach(e=>{ const cs=candidatosTitulo(e, win, usados); if(cs.length===1){ usados.add(cs[0].id); fila.push({e, t:cs[0]}); } else if(cs.length>1){ ambiguos++; } else { semmatch++; } });
  if(!fila.length){ alert(`Nenhum movimento teve título ÚNICO compatível (valor exato, ±${win} dias).\n${ambiguos} ficaram ambíguos (mais de um título com o mesmo valor) e ${semmatch} sem correspondência. Concilie manualmente.`); return; }
  if(!confirm(`Conciliar automaticamente ${fila.length} movimento(s) com correspondência única (valor exato, ±${win} dias)?\nOs demais (${ambiguos} ambíguos, ${semmatch} sem match) ficam para conferência manual.`)) return;
  let ok=0, err=0;
  for(const {e,t} of fila){
    try{
      await reqWrite('PATCH', `/rest/v1/gestao_extratos?id=eq.${e.id}`, { conciliado:true, titulo_id:t.id });
      await reqWrite('PATCH', `/rest/v1/gestao_titulos?id=eq.${t.id}`, { pago:true, status:'pago', data_pagamento:e.data, valor_pago:Math.abs(Number(e.valor)), conta_ref:e.conta_ref, extrato_id:e.id, lancado_em:new Date().toISOString() });
      ok++;
    }catch(_){ err++; }
  }
  await recarregarTitulos(); L.extratos=await lerExtratos(); render();
  alert(`Conciliação automática concluída: ${ok} baixado(s)${err?`, ${err} com erro`:''}.\nRestaram ${ambiguos} ambíguo(s) e ${semmatch} sem match para conferência manual.`);
}

function veiculoDaPosicaoG(vs,pos){ let acc=0; for(let k=0;k<(vs||[]).length;k++){ acc+=(vs[k].capacidade||0); if(pos<acc) return k; } return Math.max(0,(vs||[]).length-1); }
function resumoVeiculosG(l){
  if(!l.veiculos||!l.veiculos.length) return [];
  const g=l.veiculos.map(()=>[]);
  (l.animais||[]).forEach((a,i)=>{ const k=veiculoDaPosicaoG(l.veiculos,i); if(g[k]) g[k].push(a); });
  return l.veiculos.map((v,k)=>({nome:`${v.nome} ${k+1}`, cap:v.capacidade, n:(g[k]||[]).length}));
}

function calcVenda(id){
  const l=(L.lotes||[]).find(x=>x.id===id); if(!l) return;
  const g=x=>document.getElementById(x+"_"+id);

  const base=(g("va_base")||{}).value||"carcaca";
  const arroba=parseFloat((g("va_arroba")||{}).value)||null;
  const rend = (carc!=null && l.peso_medio)? Math.round(carc/l.peso_medio*1000)/10 : null;
  if(g("va_rend")) g("va_rend").value = rend!=null? rend+' %':'';
  let kg = base==="carcaca" ? (carc!=null? carc*(l.cabecas||0):null) : (l.peso_total!=null?l.peso_total:null);
  const arrobas = kg!=null? kg/15 : null;
  const total = (arrobas!=null && arroba!=null)? Math.round(arrobas*arroba*100)/100 : null;
  const tEl=g("va_total"); if(tEl && total!=null && tEl.dataset.man!=='1') tEl.value=total;
  const prev=g("va_prev");
  if(prev) prev.innerHTML = (arrobas!=null?`${(Math.round(arrobas*10)/10).toString().replace('.',',')} @ ${base==="carcaca"?"de carcaça":"de peso vivo"}`:"") + (total!=null?` × ${fmtBRL(arroba)}/@ = <b>${fmtBRL(total)}</b>`:"");
}

async function concluirVenda(id){
  const lote=(L.lotes||[]).find(l=>l.id===id); if(!lote) return;
  const g=x=>document.getElementById(x+"_"+id);
  const carc=parseFloat((g("va_carc")||{}).value)||null;
  const base=g("va_base")?g("va_base").value:"carcaca";
  const arroba=(g("va_arroba")&&g("va_arroba").value)?parseFloat(g("va_arroba").value):null;
  let total=(g("va_total")&&g("va_total").value)?parseFloat(g("va_total").value):null;
  const venc=(g("va_venc")&&g("va_venc").value)?g("va_venc").value:null;
  const nf=(g("va_nf")&&g("va_nf").value)?g("va_nf").value.trim():null;
  const titId=(g("va_tit")&&g("va_tit").value)?g("va_tit").value:null;
  const obs=(g("va_obs")&&g("va_obs").value)?g("va_obs").value.trim():null;
  const rend = (carc!=null && lote.peso_medio)? Math.round(carc/lote.peso_medio*1000)/10 : (lote.rendimento_pct??null);
  if(total==null && arroba!=null){
    let kg = base==="carcaca" ? (carc!=null?carc*(lote.cabecas||0):null) : (lote.peso_total!=null?lote.peso_total:null);
    if(kg!=null) total=Math.round(kg/15*arroba*100)/100;
  }
  if(total==null){ alert("Informe o preço por arroba (ou o valor total)."); return; }
  const novoDoc=Object.assign({}, lote); delete novoDoc.id;
  Object.assign(novoDoc,{ gestao_status:"concluido", peso_medio_carcaca:(carc!=null?Math.round(carc*10)/10:(lote.peso_medio_carcaca??null)), rendimento_pct:rend,
    status:(carc!=null?"finalizado":lote.status), gestao_valor_arroba:arroba, gestao_valor_total:Math.round(total*100)/100, gestao_base_peso:base,
    gestao_vencimento:venc, gestao_nf:nf, gestao_titulo_id:titId, gestao_obs:obs, gestao_concluido_em:new Date().toISOString() });
  try{
    await reqWrite("PATCH", `/rest/v1/lotes?id=eq.${id}`, {doc:novoDoc});
    // gera a receber no Financeiro (a menos que você tenha vinculado a NF do SINTEGRA)

      const doc={ origem:'avulso', categoria:'venda_abate', lote_id:id, tipo_titulo:'receber', contraparte_nome:lote.frigorifico,
        descricao:`Venda p/ abate — ${lote.frigorifico} (${lote.cabecas||0} cab${nf?', NF '+nf:''})`, valor:Math.round(total*100)/100,
        data_emissao:new Date().toISOString().slice(0,10), vencimento:venc, rateio_tipo:'total', rateio:[], pago:false, atualizado_em:new Date().toISOString() };
      const ex=(L.gestao_lancamentos||[]).find(x=>x.lote_id===id && x.categoria==='venda_abate');
      if(ex) await reqWrite('PATCH', `/rest/v1/gestao_lancamentos?id=eq.${ex.id}`, {doc});
      else await reqWrite('POST', `/rest/v1/gestao_lancamentos`, {doc});
      await recarregarLancamentos();
    }
    await recarregarLotes(); render();
  }catch(e){ alert("Erro ao concluir: "+(e.message||e)); }
}

  </div>

    <div style="overflow-x:auto"><table><thead><tr><th>Data</th><th>Fornecedor</th><th>Cab.</th><th>Preço</th><th class="num">Total</th><th>Venc.</th><th>Situação</th><th>Ação</th></tr></thead>
    <tbody>${compras.map(l=>`<tr><td>${l.data_emissao?fmtDate(l.data_emissao):'—'}</td><td><b>${esc(l.contraparte_nome||'—')}</b></td><td>${l.compra_cabecas||'—'}</td><td>${l.compra_modo==='cab'?'por cabeça':'por kg'}</td><td class="num money neg">${fmtBRL(l.valor)}</td><td>${l.vencimento?fmtDate(l.vencimento):'—'}</td><td>${l.pago?'<span class="tag" style="background:#e1f4e6;color:#2e7d54">pago</span>':'<span class="tag" style="background:#fdf3e0;color:#9a6b1a">a pagar</span>'}</td><td><button class="btn ghost" style="padding:4px 8px" onclick='excluirCompraLote("${l.id}")'>Excluir</button></td></tr>`).join('')}</tbody></table></div>
  </div>`:''}`;
  calcCompra();
}
function calcCompra(){
  const g=id=>document.getElementById(id);
  const cab=parseInt((g('cp_cab')||{}).value)||0;
  const modo=(g('cp_modo')||{}).value||'kg';
  const peso=parseFloat((g('cp_peso')||{}).value)||0;
  const preco=parseFloat((g('cp_preco')||{}).value)||0;
  const wrap=g('cp_wrap_peso'); if(wrap) wrap.style.display = modo==='kg'?'':'none';
  const total = modo==='kg'? peso*preco : cab*preco;
  const tEl=g('cp_total'); if(tEl && tEl.dataset.man!=='1') tEl.value = total?Math.round(total*100)/100:'';
  const prev=g('cp_prev'); if(prev) prev.innerHTML = total? (modo==='kg'?`${peso} kg × ${fmtBRL(preco)}/kg`:`${cab} cab × ${fmtBRL(preco)}/cab`)+` = <b>${fmtBRL(total)}</b>`:'';
}
async function salvarCompraLote(){
  const g=id=>document.getElementById(id);
  const forn=((g('cp_forn')||{}).value||'').trim();
  const cab=parseInt((g('cp_cab')||{}).value)||null;
  const modo=(g('cp_modo')||{}).value||'kg';
  const peso=parseFloat((g('cp_peso')||{}).value)||null;
  const preco=parseFloat((g('cp_preco')||{}).value)||null;
  let total=parseFloat((g('cp_total')||{}).value)||null;
  if(total==null){ total = modo==='kg'? (peso&&preco?peso*preco:null) : (cab&&preco?cab*preco:null); }
  if(!total){ alert('Informe peso/cabeças e preço (ou o valor total).'); return; }
  const venc=(g('cp_venc')||{}).value||null; const nf=((g('cp_nf')||{}).value||'').trim()||null; const obs=((g('cp_obs')||{}).value||'').trim()||null;
  const doc={ origem:'avulso', categoria:'compra_animais', tipo_titulo:'pagar', contraparte_nome:forn||'Compra de animais',
    descricao:`Compra de animais — ${cab||'?'} cab (${modo==='cab'?'por cabeça':'por kg'})${nf?' · NF '+nf:''}${obs?' · '+obs:''}`,
    valor:Math.round(total*100)/100, data_emissao:new Date().toISOString().slice(0,10), vencimento:venc,
    compra_cabecas:cab, compra_modo:modo, compra_peso:peso, compra_preco:preco, rateio_tipo:'total', rateio:[], pago:false, atualizado_em:new Date().toISOString() };
  try{ await reqWrite('POST','/rest/v1/gestao_lancamentos',{doc}); await recarregarLancamentos(); render(); }
  catch(e){ alert('Erro ao registrar compra: '+(e.message||e)); }

function calcPastagemG(p){ const area=parseFloat(p.area_ha)||0,cab=parseInt(p.cabecas)||0,pm=parseFloat(p.peso_medio)||0,pt=cab*pm,ua=pt/450; return {area,cab,pm,pt,ua,lot:area>0?ua/area:null,cabHa:area>0?cab/area:null}; }

  const f2=v=>v==null?"—":(Math.round(v*100)/100).toString().replace(".",",");
  let tC=0,tUA=0,tA=0;

async function cadastrarPasto(){
  const nome=(document.getElementById("pc_nome").value||"").trim();
  const area=document.getElementById("pc_area").value;
  const forr=(document.getElementById("pc_forr").value||"").trim();
  if(!nome){ alert("Informe o nome do pasto."); return; }
  const doc={ nome, area_ha: area!==""?parseFloat(area):null, forragem: forr||null };
  try{ await reqWrite("POST","/rest/v1/pastos",{doc}); await recarregarPastos(); render(); }
  catch(e){ alert("Erro ao cadastrar: "+(e.message||e)); }
}
function preencherOcup(){
  const id=document.getElementById("po_sel").value;
  const p=(L.pastos||[]).find(x=>x.id===id);
  const set=(el,v)=>{const e=document.getElementById(el);if(e)e.value=(v==null?"":v);};
  set("po_cab",p?p.cabecas:"");set("po_peso",p?p.peso_medio:"");set("po_prod",p?p.produto:"");
}
async function salvarOcupacao(){
  const id=document.getElementById("po_sel").value;
  if(!id){ alert("Escolha um pasto."); return; }
  const p=(L.pastos||[]).find(x=>x.id===id); if(!p) return;
  const cabV=document.getElementById("po_cab").value, pesoV=document.getElementById("po_peso").value, prod=(document.getElementById("po_prod").value||"").trim();
  const novo=Object.assign({},p); delete novo.id;
  novo.cabecas=cabV!==""?parseInt(cabV):null; novo.peso_medio=pesoV!==""?parseFloat(pesoV):null; novo.produto=prod||null;
  try{ await reqWrite("PATCH","/rest/v1/pastos?id=eq."+id,{doc:novo}); await recarregarPastos(); render(); }
  catch(e){ alert("Erro: "+(e.message||e)); }
}
async function excluirPasto(id){

function desenharLinha(elId, pts){
  const el=document.getElementById(elId); if(!el) return;
  const W=560,H=240,m={t:16,r:52,b:28,l:40};
  const ys=pts.map(p=>p.y); let ymin=Math.min(...ys),ymax=Math.max(...ys);
  if(ymin===ymax){ymin-=10;ymax+=10;}
  const pad=(ymax-ymin)*0.15; ymin=Math.max(0,Math.floor((ymin-pad)/10)*10); ymax=Math.ceil((ymax+pad)/10)*10;
  const X=i=>m.l+(pts.length===1?0.5:(i/(pts.length-1)))*(W-m.l-m.r);
  const Y=v=>m.t+(1-(v-ymin)/(ymax-ymin))*(H-m.t-m.b);
  const ticks=[ymin,Math.round((ymin+ymax)/2),ymax];
  const path=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const area=path+` L${X(pts.length-1).toFixed(1)} ${Y(ymin)} L${X(0).toFixed(1)} ${Y(ymin)} Z`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Peso médio mensal">
    ${ticks.map(t=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="#e8ece6"/><text x="${m.l-6}" y="${Y(t)+4}" text-anchor="end" font-size="10.5" fill="#5d6b62">${t}</text>`).join("")}
    <path d="${area}" fill="var(--serie1)" opacity="0.1"/>
    <path d="${path}" fill="none" stroke="var(--serie1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="4.5" fill="var(--serie1)" stroke="var(--card)" stroke-width="2"/>`).join("")}
    <text x="${X(pts.length-1)+8}" y="${Y(pts[pts.length-1].y)+4}" font-size="12" font-weight="700" fill="#20272e">${pts[pts.length-1].y} kg</text>
    ${pts.map((p,i)=>(pts.length<=6||i%2===0||i===pts.length-1)?`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#5d6b62">${p.x}</text>`:"").join("")}
  </svg><div class="tip" id="${elId}-tip"></div>`;
  const svg=el.querySelector("svg"),tip=document.getElementById(elId+"-tip");
  svg.addEventListener("mousemove",ev=>{ const r=svg.getBoundingClientRect(),sx=(ev.clientX-r.left)*(W/r.width);
    let best=0,bd=1e9; pts.forEach((p,i)=>{const d=Math.abs(X(i)-sx);if(d<bd){bd=d;best=i;}});
    const p=pts[best]; tip.style.left=(X(best)/W*100)+"%"; tip.style.top=(Y(p.y)/H*100)+"%";
    tip.innerHTML=`${p.x}: <b>${p.y} kg</b> · ${p.extra}`; tip.style.opacity=1; });
  svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
}
function desenharBarras(elId, pts){
  const el=document.getElementById(elId); if(!el) return;
  const W=560,H=240,m={t:16,r:12,b:28,l:34};
  const tot=pts.map(p=>p.s1+p.s2); const ymax=Math.max(1,Math.ceil(Math.max(...tot)/2)*2);
  const iw=(W-m.l-m.r)/pts.length, bw=Math.min(24,iw*0.55);
  const Y=v=>m.t+(1-v/ymax)*(H-m.t-m.b); const ticks=[0,Math.round(ymax/2),ymax];
  let bars="";
  pts.forEach((p,i)=>{ const x=m.l+iw*i+(iw-bw)/2; const y1=Y(p.s1),y0=Y(0);
    if(p.s1>0) bars+=`<path d="M${x} ${y0} L${x} ${y1+4} Q${x} ${y1} ${x+4} ${y1} L${x+bw-4} ${y1} Q${x+bw} ${y1} ${x+bw} ${y1+4} L${x+bw} ${y0} Z" fill="var(--serie1)"/>`;
    if(p.s2>0){ const yb=p.s1>0?y1-2:y0, yt=Y(p.s1+p.s2)-(p.s1>0?2:0);
      bars+=`<path d="M${x} ${yb} L${x} ${yt+4} Q${x} ${yt} ${x+4} ${yt} L${x+bw-4} ${yt} Q${x+bw} ${yt} ${x+bw} ${yt+4} L${x+bw} ${yb} Z" fill="var(--serie2)"/>`; }
    const t=p.s1+p.s2; if(t>0) bars+=`<text x="${x+bw/2}" y="${Y(t)-6-(p.s1>0&&p.s2>0?2:0)}" text-anchor="middle" font-size="11" font-weight="700" fill="#20272e">${t}</text>`;
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Partos por mês">
    ${ticks.map(t=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="#e8ece6"/><text x="${m.l-6}" y="${Y(t)+4}" text-anchor="end" font-size="10.5" fill="#5d6b62">${t}</text>`).join("")}
    ${bars}
    ${pts.map((p,i)=>`<text x="${m.l+iw*i+iw/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#5d6b62">${p.x}</text>`).join("")}
  </svg><div class="tip" id="${elId}-tip"></div>`;
  const svg=el.querySelector("svg"),tip=document.getElementById(elId+"-tip");
  svg.addEventListener("mousemove",ev=>{ const r=svg.getBoundingClientRect(),sx=(ev.clientX-r.left)*(W/r.width);
    const i=Math.max(0,Math.min(pts.length-1,Math.floor((sx-m.l)/iw))); const p=pts[i];
    tip.style.left=((m.l+iw*i+iw/2)/W*100)+"%"; tip.style.top=(Y(p.s1+p.s2)/H*100)+"%";
    tip.innerHTML=`${p.x}: <b>${p.s1+p.s2} partos</b> · IATF ${p.s1} · monta ${p.s2}`; tip.style.opacity=1; });
  svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
}

// ===================== exportações =====================
function baixarCSV(nome,cab,linhas){
  const sep=";";
  const csv="﻿"+[cab.join(sep)].concat(linhas.map(l=>l.map(v=>{ v=(v??"").toString().replace(/"/g,'""'); return /[;"\n]/.test(v)?('"'+v+'"'):v; }).join(sep))).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click(); a.remove();
}
function exportar(qual){
  const hoje=new Date().toISOString().slice(0,10), A=L.animais;
  const nome=id=>{ const a=A.find(x=>x.id===id); return a?(a.numero??a.codigo_arquivo??""):""; };
  if(qual==="animais") baixarCSV(`animais-${hoje}.csv`,["Numero","Tipo","Categoria","Raca","Nascimento","Idade","Peso (kg)","Status","Arquivado"],
    A.map(a=>[a.numero??a.codigo_arquivo??"",a.tipo,categoriaAnimal(a),a.raca||"",fmtDate(a.data_nascimento),idadeTxt(a.data_nascimento),a.peso??"",a.status||"ativo",a.arquivado?"sim":"não"]));
  else if(qual==="pesagens") baixarCSV(`pesagens-${hoje}.csv`,["Animal","Data","Peso (kg)","Vermifugo","Carbunculo","Vacina reprodutiva","Outros"],
    L.operacoes_rebanho.map(o=>[nome(o.animal_id),fmtDate(o.data),o.peso??"",o.vermifugo?"sim":"",o.carbunculo?"sim":"",o.vacina_reprodutiva?"sim":"",o.outros_medicamentos||""]));
  else if(qual==="reproducao") baixarCSV(`reproducao-${hoje}.csv`,["Femea","Ciclo","Metodo","Touro/Semen","Equipe","Fase","Resultado","Data cobertura","Data diagnostico"],
    L.reproducao.map(r=>[nome(r.animal_id),r.ciclo??"",r.tipo==="iatf"?"IATF":"Monta",r.touro_nome||"",r.equipe_nome||"",r.fase||"",r.resultado_prenhez===true?"prenhe":r.resultado_prenhez===false?"vazia":"",fmtDate(r.data_cobertura),fmtDate(r.data_diagnostico)]));
  else if(qual==="descarte"){ const d=(window.__reb||{}).descarte||[];
    baixarCSV(`descarte-${hoje}.csv`,["Numero","Categoria","Idade","Motivo"], d.map(x=>[x.f.numero??"",categoriaAnimal(x.f),idadeTxt(x.f.data_nascimento),x.motivo])); }
  else if(qual==="titulos"){ const T=L.titulos||[];
    baixarCSV(`titulos-${hoje}.csv`,["Tipo","Emissao","Vencimento","Contraparte","CPF/CNPJ","Documento","Numero","Valor","CFOP","Natureza","Status","Pago","Data pagamento"],
      T.map(t=>[t.tipo_titulo==="pagar"?"A pagar":"A receber",fmtDate(String(t.data_emissao||"").slice(0,10)),fmtDate(t.vencimento),t.contraparte_nome||"",t.contraparte_doc||"",t.tipo_doc||"",t.numero||"",Number(t.valor||0).toFixed(2).replace(".",","),t.cfop||"",t.natureza||"",t.status||"",t.pago?"sim":"",fmtDate(t.data_pagamento)])); }
}
