name: Build APK

on:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Generate project files
        run: |
          cat > settings.gradle <<'CLAUDE_FILE_EOF_9137'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FazendaBalanca"
          include(":app")

          CLAUDE_FILE_EOF_9137
          cat > build.gradle <<'CLAUDE_FILE_EOF_9137'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }

          CLAUDE_FILE_EOF_9137
          cat > gradle.properties <<'CLAUDE_FILE_EOF_9137'
          org.gradle.jvmargs=-Xmx3072m
          android.useAndroidX=true
          android.enableJetifier=false
          kotlin.code.style=official

          CLAUDE_FILE_EOF_9137
          mkdir -p app
          cat > app/build.gradle <<'CLAUDE_FILE_EOF_9137'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.fazendarealeza.balanca'
              compileSdk 34
              defaultConfig {
                  applicationId "com.fazendarealeza.balanca"
                  minSdk 24
                  targetSdk 34
                  versionCode 4
                  versionName "1.3"
              }
              buildTypes {
                  debug {
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
          }

          CLAUDE_FILE_EOF_9137
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'CLAUDE_FILE_EOF_9137'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"/>
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Fazenda Realeza - Balanca"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>

          CLAUDE_FILE_EOF_9137
          mkdir -p app/src/main/java/com/fazendarealeza/balanca
          cat > app/src/main/java/com/fazendarealeza/balanca/MainActivity.kt <<'CLAUDE_FILE_EOF_9137'
          package com.fazendarealeza.balanca

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothServerSocket
          import android.bluetooth.BluetoothSocket
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import java.io.InputStream
          import java.util.UUID

          class MainActivity : Activity() {

              private val APP_URL = "https://innutri.github.io/fazenda-realeza/"
              private val SPP_UUID = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB")

              private lateinit var web: WebView
              private lateinit var status: TextView
              private lateinit var bigWeight: TextView
              private lateinit var log: TextView
              private lateinit var logScroll: ScrollView

              private var clientSocket: BluetoothSocket? = null
              private var serverSecure: BluetoothServerSocket? = null
              private var serverInsecure: BluetoothServerSocket? = null
              @Volatile private var alive = true
              @Volatile private var serversStarted = false
              @Volatile private var connected = false
              @Volatile private var jsMode = ""
              @Volatile private var lastWeight = ""
              @Volatile private var lastStatusText = "iniciando"
              private val logLines = ArrayList<String>()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL

                  val bar = LinearLayout(this)
                  bar.orientation = LinearLayout.HORIZONTAL
                  bar.setBackgroundColor(Color.parseColor("#0E5A34"))
                  bar.setPadding(dp(10), dp(8), dp(10), dp(8))
                  bar.gravity = Gravity.CENTER_VERTICAL

                  status = TextView(this)
                  status.text = "Balanca: iniciando..."
                  status.setTextColor(Color.WHITE)
                  status.textSize = 13f
                  status.layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)

                  val btnConnect = Button(this)
                  btnConnect.text = "Conectar"
                  btnConnect.setOnClickListener { pickDevice() }

                  val btnLog = Button(this)
                  btnLog.text = "Dados"
                  btnLog.setOnClickListener { toggleLog() }

                  bar.addView(status)
                  bar.addView(btnConnect)
                  bar.addView(btnLog)

                  bigWeight = TextView(this)
                  bigWeight.text = ""
                  bigWeight.visibility = View.GONE
                  bigWeight.setBackgroundColor(Color.parseColor("#0A3D22"))
                  bigWeight.setTextColor(Color.parseColor("#BFF3D0"))
                  bigWeight.textSize = 30f
                  bigWeight.setTypeface(Typeface.DEFAULT_BOLD)
                  bigWeight.gravity = Gravity.CENTER
                  bigWeight.setPadding(dp(8), dp(10), dp(8), dp(10))
                  bigWeight.layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)

                  logScroll = ScrollView(this)
                  logScroll.visibility = View.VISIBLE
                  logScroll.setBackgroundColor(Color.parseColor("#111111"))
                  logScroll.layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(150))

                  log = TextView(this)
                  log.setTextColor(Color.parseColor("#9DEBB8"))
                  log.textSize = 11f
                  log.typeface = Typeface.MONOSPACE
                  log.setPadding(dp(8), dp(8), dp(8), dp(8))
                  log.text = "Painel de dados - tudo que chegar da balanca aparece aqui.\n"
                  logScroll.addView(log)

                  web = WebView(this)
                  web.layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.databaseEnabled = true
                  web.webViewClient = WebViewClient()
                  web.webChromeClient = WebChromeClient()
                  web.addJavascriptInterface(Bridge(), "BalancaNativo")

                  root.addView(bar)
                  root.addView(bigWeight)
                  root.addView(logScroll)
                  root.addView(web)
                  setContentView(root)

                  web.loadUrl(APP_URL)
                  ensurePermissions()
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun ensurePermissions() {
                  if (Build.VERSION.SDK_INT >= 31) {
                      val need = ArrayList<String>()
                      if (checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) need.add(Manifest.permission.BLUETOOTH_CONNECT)
                      if (checkSelfPermission(Manifest.permission.BLUETOOTH_SCAN) != PackageManager.PERMISSION_GRANTED) need.add(Manifest.permission.BLUETOOTH_SCAN)
                      if (need.isNotEmpty()) { requestPermissions(need.toTypedArray(), 1); return }
                  }
                  startServers()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  startServers()
              }

              private fun hasConnectPerm(): Boolean =
                  Build.VERSION.SDK_INT < 31 || checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED

              private fun startServers() {
                  if (serversStarted) return
                  if (!hasConnectPerm()) { setStatus("permita o Bluetooth para receber da balanca"); return }
                  val adapter = BluetoothAdapter.getDefaultAdapter()
                  if (adapter == null) { setStatus("sem Bluetooth neste aparelho"); return }
                  serversStarted = true
                  Thread { acceptLoop(adapter, true) }.start()
                  Thread { acceptLoop(adapter, false) }.start()
                  val extra = if (adapter.isEnabled) "" else " (LIGUE o Bluetooth do celular)"
                  setStatus("pronto - aguardando a balanca conectar" + extra)
                  appendLog("== app OUVINDO (SPP seguro + inseguro), PIN 0000 ==")
              }

              private fun acceptLoop(adapter: BluetoothAdapter, secure: Boolean) {
                  val tag = if (secure) "seguro" else "inseguro"
                  while (alive) {
                      var ss: BluetoothServerSocket? = null
                      try {
                          ss = if (secure) adapter.listenUsingRfcommWithServiceRecord("FRB", SPP_UUID)
                               else adapter.listenUsingInsecureRfcommWithServiceRecord("FRB", SPP_UUID)
                          if (secure) serverSecure = ss else serverInsecure = ss
                          while (alive) {
                              val s = ss.accept()
                              val nm = try { s.remoteDevice?.name ?: "?" } catch (e: Exception) { "?" }
                              runOnUiThread { setStatus("BALANCA CONECTADA (" + tag + ") - aguardando peso"); appendLog("== CONECTOU (" + tag + "): " + nm + " ==") }
                              try { readStream(s.inputStream) } catch (e: Exception) { runOnUiThread { appendLog("erro leitura: " + (e.message ?: "")) } }
                              try { s.close() } catch (e: Exception) {}
                              runOnUiThread { setStatus("desconectou - aguardando de novo"); appendLog("== desconectou (" + tag + ") ==") }
                          }
                      } catch (e: Exception) {
                          if (alive) runOnUiThread { appendLog("servidor " + tag + ": " + (e.message ?: "")) }
                          try { ss?.close() } catch (x: Exception) {}
                          try { Thread.sleep(1500) } catch (x: Exception) {}
                      }
                  }
              }

              private fun pickDevice() {
                  if (!hasConnectPerm()) { ensurePermissions(); setStatus("permita o Bluetooth e toque em Conectar de novo"); return }
                  val adapter = BluetoothAdapter.getDefaultAdapter()
                  if (adapter == null) { setStatus("sem Bluetooth neste aparelho"); return }
                  if (!adapter.isEnabled) { setStatus("ligue o Bluetooth do celular"); return }
                  val bonded = try { adapter.bondedDevices.toList() } catch (e: SecurityException) { emptyList<BluetoothDevice>() }
                  if (bonded.isEmpty()) { setStatus("nenhum aparelho pareado. Pareie a balanca (PIN 0000)."); return }
                  val names = bonded.map { d -> safeName(d) + "\n" + d.address }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Tentar conectar na balanca (modo inverso)")
                      .setItems(names) { _, i -> connect(bonded[i]) }
                      .show()
              }

              private fun safeName(d: BluetoothDevice): String = try { d.name ?: "(sem nome)" } catch (e: SecurityException) { "(sem nome)" }

              private fun connect(device: BluetoothDevice) {
                  setStatus("conectando em " + safeName(device) + "...")
                  appendLog("== tentando conectar (cliente) em " + safeName(device) + " ==")
                  Thread {
                      try {
                          try { BluetoothAdapter.getDefaultAdapter()?.cancelDiscovery() } catch (e: Exception) {}
                          var s: BluetoothSocket
                          try {
                              s = device.createRfcommSocketToServiceRecord(SPP_UUID)
                              s.connect()
                          } catch (e1: Exception) {
                              try {
                                  s = device.createInsecureRfcommSocketToServiceRecord(SPP_UUID)
                                  s.connect()
                              } catch (e2: Exception) {
                                  val m = device.javaClass.getMethod("createRfcommSocket", Int::class.javaPrimitiveType)
                                  s = m.invoke(device, 1) as BluetoothSocket
                                  s.connect()
                              }
                          }
                          clientSocket = s
                          runOnUiThread { setStatus("conectada (cliente): " + safeName(device)); appendLog("== CONECTOU (cliente) ==") }
                          readStream(s.inputStream)
                      } catch (e: Exception) {
                          runOnUiThread { setStatus("falha ao conectar: " + (e.message ?: "erro")); appendLog("falha cliente: " + (e.message ?: "")) }
                      }
                  }.start()
              }

              private fun toHex(b: ByteArray, n: Int): String {
                  val sb = StringBuilder()
                  for (i in 0 until n) { sb.append(String.format("%02X", b[i].toInt() and 0xFF)); if (i < n - 1) sb.append(' ') }
                  return sb.toString()
              }

              private fun toAscii(b: ByteArray, n: Int): String {
                  val sb = StringBuilder()
                  for (i in 0 until n) { val c = b[i].toInt() and 0xFF; sb.append(if (c in 32..126) c.toChar() else '.') }
                  return sb.toString()
              }

              private fun readStream(input: InputStream) {
                  val buf = ByteArray(1024)
                  while (true) {
                      val n = input.read(buf)
                      if (n < 0) break
                      val asc = toAscii(buf, n)
                      val hex = toHex(buf, n)
                      runOnUiThread { appendLog("RX[" + n + "] \"" + asc + "\"  hex: " + hex) }
                      val text = String(buf, 0, n, Charsets.ISO_8859_1)
                      for (part in text.split('\n', '\r')) {
                          val line = part.trim()
                          if (line.isNotEmpty()) { val f = line; runOnUiThread { onLine(f) } }
                      }
                  }
              }

              private fun onLine(line: String) {
                  val eid = Regex("\\d{15,16}").find(line)?.value
                  val nums = Regex("-?\\d+[.,]?\\d*").findAll(line).map { it.value.replace(',', '.') }.toList()
                  val pesoCand = nums.filter { it != eid && it.length <= 7 }
                  val peso = pesoCand.lastOrNull()
                  if (peso != null && peso.any { it.isDigit() }) {
                      inject(peso, eid ?: "")
                      runOnUiThread {
                          setStatus("peso recebido: " + peso + " kg")
                          bigWeight.text = peso + " kg"
                          bigWeight.visibility = View.VISIBLE
                      }
                  }
              }

              private fun inject(peso: String, eid: String) {
                  val js = "window.balancaPeso && window.balancaPeso(" + peso + ", '" + eid + "');"
                  web.post { web.evaluateJavascript(js, null) }
              }

              private fun appendLog(line: String) {
                  logLines.add(line)
                  while (logLines.size > 80) logLines.removeAt(0)
                  log.text = logLines.joinToString("\n")
                  logScroll.post { logScroll.fullScroll(View.FOCUS_DOWN) }
              }

              private fun toggleLog() {
                  logScroll.visibility = if (logScroll.visibility == View.GONE) View.VISIBLE else View.GONE
              }

              private fun setStatus(t: String) { lastStatusText = t; status.text = "Balanca: " + t; pushStatus() }

              inner class Bridge {
                  @android.webkit.JavascriptInterface fun presente(): Boolean = true
                  @android.webkit.JavascriptInterface fun status(): String = statusJson()
                  @android.webkit.JavascriptInterface fun conectar() { runOnUiThread { startServers(); connectBondedScale() } }
              }
              private fun jsEsc(s: String): String = s.replace("\\", "\\\\").replace("\"", "\\\"").replace("\n", " ").replace("\r", " ")
              private fun statusJson(): String =
                  "{\"conectado\":" + connected + ",\"modo\":\"" + jsEsc(jsMode) + "\",\"ultimoPeso\":\"" + jsEsc(lastWeight) + "\",\"texto\":\"" + jsEsc(lastStatusText) + "\"}"
              private fun pushStatus() {
                  val js = "window.balancaStatus && window.balancaStatus('" + statusJson() + "')"
                  web.post { try { web.evaluateJavascript(js, null) } catch (e: Exception) {} }
              }
              private fun connectBondedScale() {
                  if (!hasConnectPerm()) { setStatus("permita o Bluetooth"); return }
                  val adapter = BluetoothAdapter.getDefaultAdapter() ?: return
                  val bonded = try { adapter.bondedDevices.toList() } catch (e: Exception) { emptyList<BluetoothDevice>() }
                  val scale = bonded.firstOrNull { val n = safeName(it).uppercase(); n.contains("XR") || n.contains("5000") || n.contains("TRU") } ?: bonded.firstOrNull()
                  if (scale != null) connect(scale) else setStatus("nenhuma balanca pareada (PIN 0000)")
              }

              override fun onDestroy() {
                  alive = false
                  try { serverSecure?.close() } catch (e: Exception) {}
                  try { serverInsecure?.close() } catch (e: Exception) {}
                  try { clientSocket?.close() } catch (e: Exception) {}
                  super.onDestroy()
              }

              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }
          }

          CLAUDE_FILE_EOF_9137
      - name: Download Gradle 8.7
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip
      - name: Build debug APK
        run: ./gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk fazenda-realeza-balanca.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fazenda-realeza-balanca-apk
          path: fazenda-realeza-balanca.apk
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: balanca-v4
          name: Fazenda Realeza - Balanca (APK) v1.3 aba Balanca
          body: APK v1.3 - ponte de mao dupla; a aba Balanca do app mostra status e botao Verificar/Conectar.
          files: fazenda-realeza-balanca.apk
